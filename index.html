<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#06030d">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js"}}</script>
<title>KJ’s Picks</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* KJ's Picks base styles (moved unchanged from app.html) */
:root{
  --bg:#06030d;--panel:#0f0a1c;--panel2:#160e29;--edge:#2c1c4d;--edge2:#3e2a68;--ink:#f5f1ff;--dim:#a99cc7;--dim2:#7b6f98;
  --green:#39ff88;--red:#ff4566;--gold:#ffd23f;--blue:#1ee3ff;--purple:#b06bff;--orange:#ff9f2e;--pink:#ff2e88;--white:#ffffff;
  --g-glow:0 0 10px rgba(57,255,136,.55);--r-glow:0 0 10px rgba(255,69,102,.55);--y-glow:0 0 12px rgba(255,210,63,.6);
  --b-glow:0 0 10px rgba(30,227,255,.55);--p-glow:0 0 12px rgba(176,107,255,.6);
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;--disp:"Bebas Neue",Impact,sans-serif;--tech:Orbitron,var(--mono);
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:14.5px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);
  background-image:radial-gradient(1100px 520px at 0% -5%,rgba(176,107,255,.20),transparent 60%),radial-gradient(900px 480px at 100% 0%,rgba(255,46,136,.16),transparent 60%),
  radial-gradient(1000px 700px at 50% 120%,rgba(30,227,255,.10),transparent 60%),
  linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:auto,auto,auto,32px 32px,32px 32px;background-attachment:fixed;padding-bottom:76px}
a{color:var(--blue);text-decoration:none}button{font:inherit;color:inherit}
.mono{font-family:var(--mono)}.tech{font-family:var(--tech)}
.g{color:var(--green)}.r{color:var(--red)}.y{color:var(--gold)}.b{color:var(--blue)}.p{color:var(--purple)}.o{color:var(--orange)}.w{color:#fff}.d{color:var(--dim)}
/* ticker */
.ticker{position:sticky;top:0;z-index:50;display:flex;height:36px;background:#000;border-bottom:2px solid var(--gold);box-shadow:0 2px 20px rgba(255,210,63,.3);
  font-family:var(--mono);font-size:12.5px;overflow:hidden}
.tk-l{flex:none;display:flex;align-items:center;gap:7px;padding:0 12px;background:linear-gradient(90deg,var(--pink),#b5106a);color:#fff;font:900 11px var(--tech);letter-spacing:.12em}
.dot{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:pulse 1.2s infinite}
.tk-w{flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 2%,#000 98%,transparent);mask-image:linear-gradient(90deg,transparent,#000 2%,#000 98%,transparent)}
.tk-t{display:inline-flex;height:100%;align-items:center;white-space:nowrap;animation:scroll var(--dur,160s) linear infinite}
.ticker:hover .tk-t{animation-play-state:paused}
.tk{display:inline-flex;align-items:center;gap:8px;padding:0 18px;height:100%;border-right:1px solid #222;cursor:pointer}
.tk .k{font-weight:700}
@keyframes scroll{to{transform:translateX(-50%)}}@keyframes pulse{50%{opacity:.25}}
/* header */
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin:18px 0 10px}
.brand h1{margin:0;font:400 clamp(46px,8vw,84px)/.9 var(--disp);letter-spacing:.05em;color:#fff;
  text-shadow:0 0 3px #fff,0 0 14px var(--pink),0 0 32px var(--pink),0 0 60px rgba(255,46,136,.6)}
.brand .sub{font:700 clamp(10px,2.2vw,13px) var(--tech);letter-spacing:.32em;color:var(--blue);text-shadow:var(--b-glow);margin-top:6px}
.status{background:#000;border:1px solid var(--edge2);border-radius:12px;padding:10px 14px;font-family:var(--mono);font-size:12px;min-width:260px;box-shadow:inset 0 0 20px rgba(176,107,255,.18)}
.status .live{display:flex;align-items:center;gap:8px;color:var(--green);font:900 12px var(--tech);letter-spacing:.2em;text-shadow:var(--g-glow)}
.status .live .dot{background:var(--green);box-shadow:0 0 8px var(--green)}
.status .row{display:flex;justify-content:space-between;gap:14px;color:var(--dim)}.status .row b{color:#fff;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:12px 0 4px}
.stat{background:#000;border:1px solid var(--edge2);border-radius:12px;padding:10px 12px;position:relative;overflow:hidden}
.stat .v{font:800 26px var(--tech);color:var(--gold);text-shadow:var(--y-glow);line-height:1.1}
.stat .k{font:700 10px var(--tech);letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-top:4px}
.stat.g .v{color:var(--green);text-shadow:var(--g-glow)}.stat.r .v{color:var(--red);text-shadow:var(--r-glow)}.stat.b .v{color:var(--blue);text-shadow:var(--b-glow)}
/* nav */
.tabs{position:sticky;top:36px;z-index:40;display:flex;gap:6px;padding:10px 0;margin-top:6px;background:linear-gradient(180deg,rgba(6,3,13,.98),rgba(6,3,13,.9));
  backdrop-filter:blur(8px);border-bottom:1px solid var(--edge);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--edge2);background:var(--panel);font:700 12px var(--tech);letter-spacing:.08em;cursor:pointer;color:var(--ink);white-space:nowrap}
.tab:hover{border-color:var(--blue);box-shadow:var(--b-glow)}.tab.on{background:var(--pink);border-color:var(--pink);box-shadow:0 0 14px rgba(255,46,136,.6);color:#fff}
.tab.gold{border-color:var(--gold);color:var(--gold);text-shadow:0 0 8px rgba(255,210,63,.5)}.tab.gold.on{background:var(--gold);border-color:var(--gold);color:#000;box-shadow:var(--y-glow);text-shadow:none}
.bnav button.gold{color:var(--gold)}.bnav button.gold.on{color:#fff;text-shadow:var(--y-glow)}
.tab.gd{border-color:var(--green);color:var(--green)}.tab.gd.on{background:var(--green);color:#000;box-shadow:var(--g-glow)}
.badge-n{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--gold);color:#000;font-size:11px;text-align:center}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;grid-template-columns:repeat(5,1fr);background:rgba(0,0,0,.94);border-top:2px solid var(--pink);
  padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px)}
.bnav button{background:none;border:0;padding:9px 0 8px;font:700 10px var(--tech);letter-spacing:.08em;color:var(--dim)}
.bnav button i{display:block;font-style:normal;font-size:18px;line-height:1.1}
.bnav button.on{color:var(--pink);text-shadow:0 0 8px rgba(255,46,136,.7)}
/* sections */
h2.sec{margin:26px 0 10px;font:400 30px/1 var(--disp);letter-spacing:.06em;color:var(--gold);text-shadow:var(--y-glow);display:flex;align-items:center;gap:10px}
h2.sec small{font:600 12px Inter;letter-spacing:0;color:var(--dim);text-shadow:none}
h3{font:700 13px var(--tech);letter-spacing:.12em;color:var(--blue);margin:18px 0 8px;text-transform:uppercase}
.panel{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--edge2);border-radius:14px;padding:14px 16px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.auto{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.muted{color:var(--dim)}.small{font-size:12.5px}.tiny{font-size:11px}
.disclaimer{font-size:12px;color:var(--orange);margin-top:8px}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font:700 11px Inter;border:1px solid var(--edge2);background:#120b22;color:#e7defa;margin:2px 4px 2px 0;white-space:nowrap}
.chip.official{color:#000;background:var(--gold);border-color:var(--gold);box-shadow:var(--y-glow)}
.chip.strong{color:var(--green);border-color:var(--green);background:rgba(57,255,136,.08)}
.chip.lean{color:var(--blue);border-color:rgba(30,227,255,.6);background:rgba(30,227,255,.06)}
.chip.none{color:var(--dim)}
.chip.hot{color:var(--orange);border-color:var(--orange)}.chip.cold{color:var(--blue);border-color:var(--blue)}.chip.hmm{color:var(--purple);border-color:var(--purple);background:rgba(176,107,255,.1)}
.chip.warn{color:var(--orange);border-color:var(--orange);background:rgba(255,159,46,.08)}.chip.bad{color:var(--red);border-color:var(--red);background:rgba(255,69,102,.08)}
.chip.good{color:var(--green);border-color:var(--green);background:rgba(57,255,136,.08)}
/* game cards */
.gc{position:relative;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--edge2);border-radius:14px;padding:12px 14px;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s}
.gc:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:var(--b-glow)}
.gc.official{border:2px solid var(--gold);box-shadow:0 0 18px rgba(255,210,63,.35)}
.gc .top{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.teamrow{display:flex;align-items:center;gap:9px;margin:6px 0}
.logo{width:30px;height:30px;object-fit:contain;flex:none;filter:drop-shadow(0 0 4px rgba(255,255,255,.15))}
.logo.lg{width:64px;height:64px}.logo.xl{width:90px;height:90px}
.tname{font-weight:800;font-size:15px;line-height:1.15}.tname .rk{color:var(--gold);font:700 11px var(--mono);margin-right:4px}
.ap{display:inline-block;font:800 10px var(--mono);color:#000;background:var(--gold);border-radius:4px;padding:0 4px;margin-right:5px;vertical-align:2px;box-shadow:0 0 6px rgba(255,210,63,.5)}
.gdb{display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 3px;border-radius:999px;background:#fff;color:#000;font:800 10px var(--tech);letter-spacing:.06em;box-shadow:0 0 10px rgba(255,140,0,.6)}
.gdb img{height:22px;width:auto;display:block}
.tname .rec{color:var(--dim);font:500 11px var(--mono);margin-left:5px}
.lines{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px;text-align:center}
.lines>div{background:#000;border:1px solid var(--edge);border-radius:8px;padding:5px 4px}
.lines .k{font:700 9.5px var(--tech);letter-spacing:.1em;color:var(--dim)}.lines .v{font:700 14px var(--mono)}
.confbar{height:6px;background:#1d1433;border-radius:4px;overflow:hidden;margin-top:6px}.confbar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--blue))}
/* edge of the week */
.eotw{position:relative;border:2px solid var(--gold);border-radius:18px;padding:20px;background:radial-gradient(600px 220px at 20% 0%,rgba(255,210,63,.16),transparent 60%),linear-gradient(160deg,#1d1205,#0d0717 55%);
  box-shadow:0 0 26px rgba(255,210,63,.35),inset 0 0 40px rgba(255,46,136,.12);overflow:hidden}
.eotw:before{content:"";position:absolute;left:12px;right:12px;top:7px;height:8px;background:radial-gradient(circle,#fff6c4 0 2.5px,#ffd23f 3px 4px,transparent 4.5px) 0 0/18px 8px repeat-x;filter:drop-shadow(0 0 4px #ffd23f);animation:bulbs 1s steps(2) infinite}
@keyframes bulbs{50%{opacity:.35}}
.eotw .lbl{font:900 13px var(--tech);letter-spacing:.3em;color:var(--gold);text-shadow:var(--y-glow)}
.eotw .pick{font:400 clamp(34px,6vw,58px)/1 var(--disp);letter-spacing:.04em;color:#fff;text-shadow:0 0 14px rgba(255,210,63,.6);margin:8px 0 2px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.kv>div{background:rgba(0,0,0,.55);border:1px solid var(--edge2);border-radius:10px;padding:7px 10px}
.kv .k{font:700 9.5px var(--tech);letter-spacing:.12em;color:var(--dim)}.kv .v{font:800 18px var(--mono)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--blue);background:rgba(30,227,255,.08);color:var(--blue);font:700 12px var(--tech);letter-spacing:.08em;cursor:pointer}
.btn:hover{box-shadow:var(--b-glow)}.btn.gold{border-color:var(--gold);color:#000;background:var(--gold)}.btn.ghost{border-color:var(--edge2);color:var(--ink);background:var(--panel)}
.btn.green{border-color:var(--green);color:var(--green);background:rgba(57,255,136,.08)}
/* movers board */
.board{font-family:var(--mono);font-size:13px}
.board .row{display:grid;grid-template-columns:22px 1fr auto auto;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px dashed var(--edge);cursor:pointer}
.board .row:hover{background:rgba(30,227,255,.05)}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 8px;border-bottom:1px solid var(--edge);text-align:left;vertical-align:top}
th{font:700 10px var(--tech);letter-spacing:.12em;color:var(--gold);background:#000;text-transform:uppercase}
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--edge2)}
/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(3,1,8,.86);backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:20px 10px 90px}
.modal.hidden{display:none}
.sheet{width:min(1100px,100%);background:linear-gradient(170deg,#140c25,#08050f);border:1px solid var(--edge2);border-radius:18px;box-shadow:0 0 40px rgba(176,107,255,.25)}
.sheet .hd{position:sticky;top:0;z-index:2;background:linear-gradient(180deg,#140c25 85%,rgba(20,12,37,.0));border-radius:18px 18px 0 0;padding:14px 16px 6px}
.close{position:absolute;right:12px;top:10px;width:36px;height:36px;border-radius:50%;border:1px solid var(--edge2);background:#000;color:#fff;font-size:18px;cursor:pointer}
.mtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px}.mtabs::-webkit-scrollbar{display:none}
.mtab{flex:none;padding:6px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--edge2);font:700 11px var(--tech);letter-spacing:.1em;cursor:pointer}
.mtab.on{background:var(--blue);color:#000;border-color:var(--blue);box-shadow:var(--b-glow)}
.sheet .bd{padding:4px 16px 20px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.vs .at{font:400 30px var(--disp);color:var(--dim)}
.fair{border:1px solid var(--blue);border-radius:14px;padding:12px;background:rgba(30,227,255,.05);box-shadow:inset 0 0 22px rgba(30,227,255,.12)}
.fair .big{font:900 30px var(--tech);color:var(--blue);text-shadow:var(--b-glow)}
.says{border-left:4px solid var(--gold);padding:8px 12px;background:rgba(255,210,63,.05);border-radius:0 12px 12px 0}
.why li{margin:4px 0}.why .val{font:700 12px var(--mono);padding:1px 7px;border-radius:6px;margin-right:6px}
.hbar{display:grid;grid-template-columns:150px 1fr 70px;gap:8px;align-items:center;margin:5px 0;font-size:12.5px}
.hbar .track{position:relative;height:12px;background:#120b22;border-radius:6px;overflow:hidden}
.hbar .track i{position:absolute;top:0;bottom:0;border-radius:6px}.hbar .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#666}
.regime{display:flex;height:16px;border-radius:8px;overflow:hidden;border:1px solid var(--edge2)}.regime i{display:block;height:100%}
.seq{display:flex;gap:4px;flex-wrap:wrap}.seq span{padding:2px 7px;border-radius:6px;font:700 10px var(--tech);letter-spacing:.05em}
.s-up{background:rgba(255,159,46,.18);color:var(--orange);border:1px solid var(--orange)}.s-dn{background:rgba(30,227,255,.12);color:var(--blue);border:1px solid var(--blue)}
.s-n{background:rgba(176,107,255,.12);color:var(--purple);border:1px solid var(--purple)}
.ring{--v:50;width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--c,var(--blue)) calc(var(--v)*1%),#1d1433 0);display:grid;place-items:center;box-shadow:0 0 16px rgba(30,227,255,.25)}
.ring b{width:66px;height:66px;border-radius:50%;background:#0b0716;display:grid;place-items:center;font:900 20px var(--tech)}
.light{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.light.green{background:var(--green);box-shadow:var(--g-glow)}.light.yellow{background:var(--gold);box-shadow:var(--y-glow)}.light.red{background:var(--red);box-shadow:var(--r-glow)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 12px}
.filters select,.filters input,.tool select{background:#000;color:var(--ink);border:1px solid var(--edge2);border-radius:9px;padding:7px 10px;font:600 13px Inter}
.filters input{min-width:180px}
.seg{display:inline-flex;border:1px solid var(--edge2);border-radius:9px;overflow:hidden}.seg button{background:#000;border:0;padding:7px 10px;font:700 11px var(--tech);color:var(--dim);cursor:pointer}
.seg button.on{background:var(--purple);color:#fff}
.feed .it{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--edge);font-family:var(--mono);font-size:12.5px}.feed .t{color:var(--dim2);flex:none;width:58px}
.flash-up{animation:fu 2.4s ease-out 1}.flash-dn{animation:fd 2.4s ease-out 1}
@keyframes fu{0%{background:rgba(57,255,136,.45)}100%{background:transparent}}@keyframes fd{0%{background:rgba(255,69,102,.45)}100%{background:transparent}}
.arrow-up{color:var(--green);animation:bob 1.6s ease-in-out infinite}.arrow-dn{color:var(--red);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px)}}
.stale{margin:14px 0;padding:14px 16px;border:2px solid var(--red);border-radius:14px;background:rgba(255,69,102,.10);color:#ffd6dd;box-shadow:var(--r-glow)}
.empty{border:1px dashed var(--edge2);border-radius:12px;padding:16px;color:var(--dim)}
svg text{font-family:var(--mono);font-size:10px;fill:var(--dim)}
.countdown{font:800 16px var(--mono);color:var(--green)}
.feat-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.feat{position:relative;overflow:hidden;border-radius:18px;padding:16px 16px 14px;cursor:pointer;min-height:300px}
.feat .ttl{font:900 12px var(--tech);letter-spacing:.24em;display:flex;align-items:center;gap:10px}
.feat .vsrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;margin:12px 0 8px}
.feat .vsrow img{width:62px;height:62px;object-fit:contain}
.feat .nm{font:800 15px Inter;color:#fff}.feat .sm{font:500 11.5px var(--mono);color:var(--dim)}
.feat .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.feat .grid3>div{background:rgba(0,0,0,.45);border-radius:9px;padding:6px 8px;text-align:center}
.feat .grid3 .k{font:700 9px var(--tech);letter-spacing:.1em;color:var(--dim)}.feat .grid3 .v{font:800 14px var(--mono);color:#fff}
.feat-gd{border:2px solid #ff7a00;background:radial-gradient(500px 240px at 0% 0%,rgba(255,122,0,.22),transparent 60%),linear-gradient(160deg,#1b0e04,#0b0612 60%);
  box-shadow:0 0 24px rgba(255,122,0,.45),inset 0 0 30px rgba(255,122,0,.10)}
.feat-gd .ttl{color:#ff9a3c;text-shadow:0 0 10px rgba(255,122,0,.7)}
.feat-am{border:2px solid #8c1d2f;background:radial-gradient(520px 260px at 100% 0%,rgba(80,0,0,.55),transparent 65%),linear-gradient(160deg,#1e0408,#0b0612 65%);
  box-shadow:0 0 26px rgba(140,29,47,.65),inset 0 0 0 1px rgba(255,255,255,.08),inset 0 0 40px rgba(80,0,0,.35)}
.feat-am .ttl{color:#fff;text-shadow:0 0 10px rgba(255,255,255,.35)}
.feat-am .wm{position:absolute;right:-30px;bottom:-34px;width:230px;opacity:.07;pointer-events:none;filter:grayscale(1) brightness(3)}
.feat-am .bar-am{position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(#fff,#500000 30%,#500000 70%,#fff)}
.liveslot:empty{display:none}
.lbox{margin-top:10px;border-radius:12px;padding:10px 12px;background:rgba(0,0,0,.6);border:1px solid var(--green);box-shadow:0 0 14px rgba(57,255,136,.25)}
.lbox.post{border-color:var(--dim);box-shadow:none}
.lbox .score{display:flex;justify-content:space-between;align-items:center;font:900 26px var(--tech)}
.lbox .score span.tm{font:800 14px Inter;color:var(--dim)}

/* =====================================================================================================
   KJ's Picks DEPTH SYSTEM (Stage 1-2 of the 3D redesign). Presentation only - loaded after base.css.
   Depth levels (use these, never ad-hoc shadows):
     L0 background environment (#env)     L1 secondary panels (.panel, .stat, boards)
     L2 normal game cards (.gc)           L3 official picks (.gc.official, .lc)
     L4 top model play, alerts, modals    Text always faces the viewer: 3D is around the data, never on it.
   League lighting: <html data-theme-league="NCAA|NFL|ALL"> swaps --acc / --acc2 (NCAA blue/purple, NFL gold/red).
   ===================================================================================================== */
:root{
  --acc:#ff2e88;--acc2:#1ee3ff;--acc-rgb:255,46,136;--acc2-rgb:30,227,255;
  --glass:linear-gradient(165deg,rgba(255,255,255,.075),rgba(255,255,255,.018) 38%,rgba(0,0,0,.18));
  --rim:inset 0 1px 0 rgba(255,255,255,.09),inset 0 0 0 1px rgba(255,255,255,.02);
  --L1:var(--rim),0 6px 16px rgba(0,0,0,.45);
  --L2:var(--rim),0 10px 24px rgba(0,0,0,.55),0 2px 5px rgba(0,0,0,.45);
  --L3:var(--rim),0 16px 36px rgba(0,0,0,.6),0 0 20px rgba(255,210,63,.3);
  --L4:var(--rim),0 30px 64px rgba(0,0,0,.72),0 0 42px rgba(255,210,63,.45);
  --ease:cubic-bezier(.2,.7,.2,1);
}
html[data-theme-league="NCAA"]{--acc:#1ee3ff;--acc2:#b06bff;--acc-rgb:30,227,255;--acc2-rgb:176,107,255}
html[data-theme-league="NFL"]{--acc:#ffd23f;--acc2:#ff4566;--acc-rgb:255,210,63;--acc2-rgb:255,69,102}

/* ---------- L0: the sportsbook room (fixed, behind everything, pointer-events off) ---------- */
body{background:#05030b;background-image:linear-gradient(rgba(255,255,255,.014) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);background-size:32px 32px}
#env{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;contain:strict;--px:0px;--py:0px}
#env .l{position:absolute;inset:-60px}
.env-glow{transition:opacity .9s var(--ease);opacity:0;transform:translate3d(var(--px),var(--py),0)}
.env-glow.g-all{background:radial-gradient(1000px 520px at 6% -8%,rgba(176,107,255,.24),transparent 60%),radial-gradient(900px 480px at 96% -4%,rgba(255,46,136,.2),transparent 60%),radial-gradient(1200px 640px at 50% 118%,rgba(30,227,255,.13),transparent 62%)}
.env-glow.g-ncaa{background:radial-gradient(1000px 520px at 6% -8%,rgba(176,107,255,.26),transparent 60%),radial-gradient(900px 480px at 96% -4%,rgba(30,227,255,.22),transparent 60%),radial-gradient(1200px 640px at 50% 118%,rgba(30,120,255,.16),transparent 62%)}
.env-glow.g-nfl{background:radial-gradient(1000px 520px at 6% -8%,rgba(255,69,102,.2),transparent 60%),radial-gradient(900px 480px at 96% -4%,rgba(255,210,63,.2),transparent 60%),radial-gradient(1200px 640px at 50% 118%,rgba(255,150,40,.12),transparent 62%)}
html:not([data-theme-league]) .g-all,html[data-theme-league="ALL"] .g-all,html[data-theme-league="NCAA"] .g-ncaa,html[data-theme-league="NFL"] .g-nfl{opacity:1}
/* distant odds boards: blurred LED screens high on the back wall */
.env-boards{transform:translate3d(calc(var(--px) * .55),calc(var(--py) * .55),0)}
.env-boards i{position:absolute;top:9%;height:110px;border-radius:6px;opacity:.16;filter:blur(1.5px);overflow:hidden;
  background:repeating-linear-gradient(90deg,rgba(var(--acc2-rgb),.9) 0 2px,transparent 2px 5px),repeating-linear-gradient(0deg,rgba(0,0,0,.85) 0 2px,transparent 2px 9px);
  background-size:200% 100%,auto;box-shadow:0 0 40px rgba(var(--acc2-rgb),.5);-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.env-boards i:nth-child(1){left:3%;width:26%}.env-boards i:nth-child(2){left:37%;width:26%;top:5%;opacity:.12}.env-boards i:nth-child(3){right:3%;width:26%}
.fx-full .env-boards i{animation:envboard 70s linear infinite}
.fx-full .env-boards i:nth-child(2){animation-duration:95s;animation-direction:reverse}
@keyframes envboard{to{background-position:-200% 0,0 0}}
/* ceiling neon strips */
.env-strips{transform:translate3d(calc(var(--px) * .8),calc(var(--py) * .8),0);
  background:linear-gradient(180deg,transparent 3.5%,rgba(var(--acc-rgb),.22) 3.7%,transparent 4.3%),linear-gradient(180deg,transparent 30%,rgba(var(--acc2-rgb),.07) 30.2%,transparent 31%);
  filter:blur(1px);opacity:.8;transition:background .9s}
/* sportsbook floor: light pools + a faint receding grid (low contrast so it never competes with data) */
.env-floor{top:52%;transform-origin:50% 0;transform:translate3d(calc(var(--px) * .3),0,0) perspective(700px) rotateX(64deg);
  background-image:radial-gradient(40% 60% at 22% 30%,rgba(var(--acc2-rgb),.16),transparent 70%),radial-gradient(40% 60% at 78% 30%,rgba(var(--acc-rgb),.14),transparent 70%),
    linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:auto,auto,70px 70px,70px 70px;-webkit-mask-image:linear-gradient(180deg,transparent,#000 35%);mask-image:linear-gradient(180deg,transparent,#000 35%);opacity:.75}
.fx-paused *,.fx-paused *:before,.fx-paused *:after{animation-play-state:paused!important}

/* ---------- LED TICKER: a floating sportsbook board ---------- */
.ticker{height:40px;background:linear-gradient(180deg,#0b0b0f,#000 55%,#060608);border-bottom:2px solid var(--gold);
  box-shadow:0 1px 0 rgba(255,210,63,.35),0 6px 24px rgba(255,210,63,.28),0 18px 30px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);font-size:13px}
.ticker:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;opacity:.22;
  background:radial-gradient(circle,rgba(255,255,255,.18) .8px,transparent 1.2px) 0 0/4px 4px}           /* LED dot matrix */
.ticker:after{content:"";position:absolute;left:0;right:0;top:100%;height:16px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,210,63,.16),transparent);filter:blur(2px)}                    /* reflection */
.ticker .tk-w{position:relative}
.ticker .tk .k{text-shadow:0 0 8px currentColor}
.ticker .tk .w{text-shadow:0 0 6px rgba(255,255,255,.35)}
.ticker .tk{border-right:1px solid rgba(255,255,255,.07)}
.tk-l{box-shadow:6px 0 16px rgba(255,46,136,.45);position:relative;z-index:3}
.tk .mv{font-weight:800}.tk .mv.up{color:var(--green)}.tk .mv.dn{color:var(--red)}
.fx-full .tk .mv,.fx-lite .tk .mv{display:inline-block;animation:tkarrow 1.8s var(--ease) infinite}
@keyframes tkarrow{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.tk .mv.dn{animation-direction:reverse}

/* ---------- HERO: extruded neon wordmark + glass status terminal ---------- */
.hero{position:relative}
.brand{position:relative;perspective:900px}
.brand .wm{display:inline-block;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s var(--ease)}
.brand .wm.tilting{transition:transform .08s linear}
.brand h1{position:relative;isolation:isolate;color:#fff6fb;-webkit-text-fill-color:#fff6fb;
  text-shadow:0 0 2px #fff,0 0 12px rgba(255,46,136,.9),0 0 30px rgba(255,46,136,.55),0 0 60px rgba(255,46,136,.3)}
.brand h1:before{content:attr(data-text);position:absolute;left:0;top:0;z-index:-1;background:none;-webkit-text-fill-color:#2c0719;color:#2c0719;
  text-shadow:1px 1px 0 #4a0c2e,2px 2px 0 #420a29,3px 3px 0 #380822,4px 4px 0 #2e061c,5px 6px 10px rgba(0,0,0,.85)}
.brand h1:after{content:attr(data-text);position:absolute;left:0;top:0;pointer-events:none;-webkit-text-fill-color:transparent;text-shadow:none;
  background:linear-gradient(180deg,transparent 48%,rgba(255,120,190,.38) 54%,transparent 58%),linear-gradient(105deg,transparent 40%,rgba(255,255,255,.9) 50%,transparent 60%) -150% 0/250% 100% no-repeat;
  -webkit-background-clip:text;background-clip:text}
.brand h1:after{background-size:100% 100%,250% 100%}
.fx-full .brand h1:after{animation:sheen 9s ease-in-out 1.5s infinite}
@keyframes sheen{0%{background-position:0 0,-150% 0}35%,100%{background-position:0 0,150% 0}}
.brand .sub{color:var(--acc2);text-shadow:0 0 10px rgba(var(--acc2-rgb),.6);transition:color .6s}
.status{background:var(--glass),rgba(4,2,10,.72);border:1px solid rgba(var(--acc-rgb),.35);border-radius:14px;box-shadow:var(--L1),inset 0 0 24px rgba(var(--acc-rgb),.1);

/* ---------- NCAA | NFL | ALL: illuminated control console ---------- */
@media (min-width:1101px){html body #lgbar{display:flex!important}}
.lgbar{gap:6px;width:max-content;max-width:100%;margin:16px auto 8px;padding:6px;border-radius:16px;flex-wrap:nowrap;

/* ---------- L1 panels / L2 cards / L3 official / L4 top play ---------- */
.panel,.stat,.recbox,.lg-card,.al-box{box-shadow:var(--L1)}
.panel,.lg-card,.gc{background-image:var(--glass),linear-gradient(160deg,var(--panel2),var(--panel))}
.gc{box-shadow:var(--L2)}
.gc.official,.lc.official{box-shadow:var(--L3);transform:translateY(-2px)}
.gc.official:hover{transform:translateY(-4px);box-shadow:var(--L3),0 0 26px rgba(255,210,63,.45)}
.gc.WIN,.gc.LOSS{box-shadow:var(--L2)}
.home-hero{position:relative;z-index:1;transform:perspective(1100px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s var(--ease)}
.home-hero.tilting{transition:transform .08s linear}
.home-hero>.gc,.home-hero>.eotw{box-shadow:var(--L4);transform:translateY(-4px)}
.home-hero:after{content:"";position:absolute;left:8%;right:8%;bottom:-22px;height:24px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,210,63,.28),transparent);filter:blur(6px);z-index:-1}
.top-tag{display:inline-flex;align-items:center;gap:8px;margin:0 0 8px;padding:4px 12px;border-radius:999px;border:1px solid var(--gold);color:var(--gold);font:900 11px var(--tech);letter-spacing:.24em;background:rgba(255,210,63,.08);box-shadow:var(--y-glow)}

/* stat + record cards: glass slabs that lean (max 3deg) toward the cursor; a soft light follows it */
.stat,.recbox{position:relative;background:var(--glass),linear-gradient(170deg,#120c22,#05030b);border-color:rgba(255,255,255,.1);
  transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .45s var(--ease),border-color .3s}
.stat.tilting,.recbox.tilting{transition:transform .08s linear;border-color:rgba(var(--acc2-rgb),.55)}
.stat:before,.recbox:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.09),transparent 60%)}
.stat.tilting:before,.recbox.tilting:before{opacity:1}
.stat:after{content:"";position:absolute;left:12px;right:12px;top:0;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(var(--acc2-rgb),.8),transparent);opacity:.7}
.recbox.ALL{box-shadow:var(--L1),0 0 18px rgba(255,210,63,.22)}

/* boards (movers, edges, rankings): rows sit on a slab; hovering pulls a row forward */
.board .row{transition:transform .2s var(--ease),background .2s}
.board .row:hover{transform:translateX(3px)}
h2.sec{text-shadow:0 0 12px rgba(255,210,63,.55),0 2px 0 rgba(0,0,0,.6)}

/* ---------- navigation ---------- */
.tabs{background:linear-gradient(180deg,rgba(5,3,11,.96),rgba(5,3,11,.86))}
.tab{background:linear-gradient(180deg,#191329,#0c0918);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 0 #000}
#side{background:linear-gradient(180deg,rgba(11,7,22,.97),rgba(5,3,11,.97));box-shadow:8px 0 30px rgba(0,0,0,.5),inset -1px 0 0 rgba(var(--acc-rgb),.25)}
#side a.it.on{background:linear-gradient(90deg,var(--pink),#c4166a);box-shadow:0 0 14px rgba(255,46,136,.55),inset 0 1px 0 rgba(255,255,255,.25)}
.bnav{background:linear-gradient(180deg,rgba(14,9,26,.96),rgba(0,0,0,.97));border-top:2px solid var(--acc);box-shadow:0 -10px 30px rgba(0,0,0,.6),0 -1px 18px rgba(var(--acc-rgb),.3);transition:border-color .6s}
.bnav button.on{color:#fff;text-shadow:0 0 10px var(--acc)}
.bnav button.on i{transform:translateY(-2px);filter:drop-shadow(0 0 6px var(--acc))}
.bnav button i{transition:transform .2s}
.menu-btn{display:none;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--edge2);background:linear-gradient(180deg,#1b1530,#0b0816);
  color:#fff;font-size:20px;cursor:pointer;box-shadow:0 3px 0 #000,inset 0 1px 0 rgba(255,255,255,.08)}
@media (max-width:1100px){.menu-btn{display:inline-flex}}

/* ---------- homepage blocks ---------- */
.intro-strip{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin:8px 0 4px;padding:14px 18px;border-radius:16px;
  background:var(--glass),linear-gradient(120deg,rgba(var(--acc-rgb),.12),rgba(var(--acc2-rgb),.08) 60%,rgba(0,0,0,.2));border:1px solid rgba(var(--acc-rgb),.35);box-shadow:var(--L1)}
.intro-strip h2{margin:0;font:400 clamp(22px,3.4vw,34px)/1.05 var(--disp);letter-spacing:.05em;color:#fff;text-shadow:0 0 14px rgba(var(--acc-rgb),.55)}
.intro-strip p{margin:4px 0 0;font:500 13.5px/1.5 Inter;color:#ddd5f2;max-width:760px}
.intro-strip .cta{margin:0}
@media (max-width:760px){.intro-strip{grid-template-columns:1fr}}
.nextko{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.nextko .panel{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
.nextko .k{font:800 10px var(--tech);letter-spacing:.16em;color:var(--dim)}
.nextko .m{font:700 14px Inter;color:#fff}
.nextko .countdown{font:800 20px var(--mono);color:var(--acc2);text-shadow:0 0 10px rgba(var(--acc2-rgb),.5)}

/* ---------- motion primitives (used by KJFX) ---------- */
.fx-chg{animation:fxchg 1.2s var(--ease)}
.fx-chg.up{--chg:57,255,136}.fx-chg.dn{--chg:255,69,102}
@keyframes fxchg{0%{opacity:.25;transform:translateY(4px) scale(.96)}35%{opacity:1;transform:translateY(-1px) scale(1.04);text-shadow:0 0 14px rgba(var(--chg,255,255,255),.9)}100%{transform:none}}
.fx-pulse-win{animation:pwin 1.6s ease-out}.fx-pulse-loss{animation:ploss 1.6s ease-out}.fx-pulse-push{animation:ppush 1.6s ease-out}
@keyframes pwin{30%{box-shadow:0 0 0 2px var(--green),0 0 40px rgba(57,255,136,.8),0 0 70px rgba(255,210,63,.4)}}
@keyframes ploss{30%{box-shadow:0 0 0 2px var(--red),0 0 40px rgba(255,69,102,.75)}}
@keyframes ppush{30%{box-shadow:0 0 0 2px #fff,0 0 40px rgba(30,227,255,.7)}}

/* L4 alerts: slide forward from the corner, never cover the page */
#fxtoasts{position:fixed;right:16px;bottom:18px;z-index:120;display:flex;flex-direction:column;gap:10px;max-width:min(360px,calc(100vw - 32px));pointer-events:none}
.fx-toast{position:relative;pointer-events:auto;padding:12px 38px 12px 14px;border-radius:14px;border:2px solid var(--gold);color:#fff;
  background:var(--glass),linear-gradient(160deg,#1d1205,#0d0717);box-shadow:var(--L4);opacity:0;transform:translate3d(30px,10px,0) scale(.96);transition:opacity .35s var(--ease),transform .35s var(--ease)}
.fx-toast.in{opacity:1;transform:none}
.fx-toast .t{font:900 11px var(--tech);letter-spacing:.2em;color:var(--gold)}
.fx-toast .p{font:400 24px/1.05 var(--disp);letter-spacing:.04em;margin:3px 0}
.fx-toast .x2{font:700 12px var(--mono);color:var(--dim)}
.fx-x{position:absolute;top:6px;right:8px;border:0;background:none;color:var(--dim);font-size:20px;cursor:pointer;line-height:1}
@media (max-width:1100px){#fxtoasts{bottom:84px}}

/* ---------- fallbacks ---------- */
.fx-lite .stat,.fx-lite .recbox,.fx-lite .home-hero,.fx-lite .brand .wm,
.fx-off .stat,.fx-off .recbox,.fx-off .home-hero,.fx-off .brand .wm{transform:none}
.fx-lite .env-glow,.fx-lite .env-boards,.fx-lite .env-strips,.fx-off .env-glow,.fx-off .env-boards,.fx-off .env-strips{transform:none}
.fx-off .fx-toast{transition:none}
@media (max-width:760px){.env-boards{display:none}.env-floor{opacity:.5}}
@supports not ((-webkit-background-clip:text) or (background-clip:text)){.brand h1{-webkit-text-fill-color:#fff;color:#fff}.brand h1:before,.brand h1:after{display:none}}

/* =====================================================================================================
   KJ's Picks STAGE 3 COMPONENTS: top model play, matchup header, advantage meter, HMM regime nodes,
   strength chart, odds wall, tickets, live/final states. Presentation only. Text always faces the viewer.
   ===================================================================================================== */
html[data-theme-league="TEAM"]{--acc:rgb(var(--team-rgb));--acc-rgb:var(--team-rgb)}
.env-glow.g-team{background:radial-gradient(1000px 560px at 10% -10%,rgba(var(--team-rgb,176,107,255),.3),transparent 60%),radial-gradient(900px 500px at 92% 0%,rgba(var(--team-rgb,176,107,255),.18),transparent 60%),radial-gradient(1200px 640px at 50% 118%,rgba(var(--team-rgb,176,107,255),.12),transparent 62%)}
html[data-theme-league="TEAM"] .g-team{opacity:1}

/* ---------- team emblems: raised, backlit in team color, never distorted or spun ---------- */
.emb{position:relative;display:inline-grid;place-items:center;flex:none;border-radius:50%;isolation:isolate}
.emb:before{content:"";position:absolute;inset:-28%;z-index:-1;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--tc),.55),rgba(var(--tc),.12) 60%,transparent);filter:blur(4px)}
.emb img,.emb .logo{filter:drop-shadow(0 3px 2px rgba(0,0,0,.75)) drop-shadow(0 0 6px rgba(var(--tc),.5));transition:transform .3s var(--ease)}
.fx-full .emb:hover img{transform:translateY(-2px) scale(1.03)}
.emb.xl img,.emb.xl .logo{width:88px;height:88px}
.emb-pair{display:flex;gap:4px}

/* ---------- TOP MODEL PLAY (L4) ---------- */
.tp{position:relative;overflow:hidden;padding:18px 20px 16px;border:2px solid var(--gold);border-radius:20px;cursor:pointer;
  background:var(--glass),radial-gradient(520px 260px at 0% 0%,rgba(var(--tc),.28),transparent 65%),radial-gradient(600px 300px at 100% 100%,rgba(255,210,63,.12),transparent 60%),linear-gradient(160deg,#1a1006,#0c0716 60%)}
.tp-light{position:absolute;inset:0;pointer-events:none;background:radial-gradient(300px circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.08),transparent 60%)}
.tp-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tp-top .top-tag{margin:0}
.tp-main{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;margin-top:12px}
.tp .pk{font:400 clamp(34px,5.4vw,60px)/1 var(--disp);letter-spacing:.04em;color:#fff;text-shadow:0 0 16px rgba(255,210,63,.55);margin:6px 0 4px}
.tp .pk .odds{font-size:.5em;color:var(--dim);text-shadow:none}
.tp-conf{text-align:center}
.tp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.mt{padding:9px 10px;border-radius:12px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.mt .k{font:800 9.5px var(--tech);letter-spacing:.12em;color:var(--dim)}
.mt .v{font:800 19px var(--mono);color:#fff;margin-top:3px;line-height:1.15}
.mt .n{font:500 10.5px Inter;color:var(--dim2);margin-top:2px}
.mt .v.b{color:var(--blue);text-shadow:var(--b-glow)}.mt .v.g{color:var(--green);text-shadow:var(--g-glow)}.mt .v.y{color:var(--gold)}.mt .v.p{color:var(--purple)}.mt .v.r{color:var(--red)}.mt .v.d{color:var(--dim)}
.xp{display:inline-block;padding:0 5px;margin-left:4px;border-radius:4px;border:1px solid var(--orange);color:var(--orange);font-size:8.5px;letter-spacing:.08em;cursor:help}
.nowtag{display:inline-block;padding:0 4px;border-radius:4px;background:rgba(30,227,255,.15);color:var(--blue);font:800 9px var(--tech);vertical-align:middle;cursor:help}
@media (max-width:900px){.tp-grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:600px){.tp-main{grid-template-columns:auto 1fr}.tp-conf{grid-column:1/-1;display:flex;align-items:center;gap:10px;justify-content:center}.tp-grid{grid-template-columns:repeat(2,1fr)}.emb.xl img,.emb.xl .logo{width:64px;height:64px}}

/* ---------- official / live / final cards ---------- */
.lc.is-live,.tp.is-live{border-color:var(--green);box-shadow:var(--L3),0 0 0 1px rgba(57,255,136,.35),0 0 24px rgba(57,255,136,.35)}
.fx-full .lc.is-live,.fx-lite .lc.is-live{animation:livebeat 2.6s ease-in-out infinite}
@keyframes livebeat{50%{box-shadow:var(--L3),0 0 0 1px rgba(57,255,136,.6),0 0 34px rgba(57,255,136,.55)}}
.lc.WIN{box-shadow:var(--L2),0 0 16px rgba(57,255,136,.25)}.lc.LOSS{box-shadow:var(--L2),0 0 16px rgba(255,69,102,.22)}
.lc.justwin{animation:pwin 1.6s ease-out 1}.lc.justloss{animation:ploss 1.6s ease-out 1}.lc.justpush{animation:ppush 1.6s ease-out 1}
.lc .emb img,.lc .emb .logo{width:26px;height:26px}
.lc .mu{display:flex;align-items:center;gap:8px}

/* ---------- matchup header ---------- */
.mh{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:8px 0 4px;padding:16px 8px;border-radius:18px;overflow:hidden;isolation:isolate;
  background:linear-gradient(90deg,rgba(var(--ca),.22),rgba(0,0,0,.35) 45%,rgba(0,0,0,.35) 55%,rgba(var(--ch),.22));border:1px solid rgba(255,255,255,.08)}
.mh-light{position:absolute;inset:0;z-index:-1;background:radial-gradient(60% 120% at 0% 50%,rgba(var(--ca),.35),transparent 60%),radial-gradient(60% 120% at 100% 50%,rgba(var(--ch),.35),transparent 60%),
  linear-gradient(90deg,transparent 47%,rgba(255,255,255,.18) 50%,transparent 53%)}
.mh-side{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;cursor:pointer}
.mh-name{font:400 clamp(22px,3.4vw,34px)/1 var(--disp);letter-spacing:.05em;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.7)}
.mh-vs{font:900 clamp(18px,3vw,28px) var(--tech);color:#fff;letter-spacing:.1em;text-shadow:0 0 14px rgba(255,255,255,.7),0 0 30px rgba(var(--ca),.6),0 0 30px rgba(var(--ch),.6)}
.mh-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
@media (max-width:600px){.mh .emb.xl img,.mh .emb.xl .logo{width:56px;height:56px}.mh-nums .mt .v{font-size:15px}}
/* advantage depth meter: floating bar, lit center line, the favored side's color extends toward that team */
.advm{margin:12px 2px 2px}
.advm-lab{display:flex;justify-content:space-between;align-items:center;gap:8px;font:700 13px var(--mono);color:#fff}
.advm-track{position:relative;height:14px;margin-top:6px;border-radius:999px;background:linear-gradient(180deg,#05030b,#140e24);border:1px solid rgba(255,255,255,.1);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.8),0 8px 16px rgba(0,0,0,.5)}
.advm-mid{position:absolute;left:50%;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 8px #fff,0 0 16px rgba(255,255,255,.6);border-radius:2px}
.advm-fill{position:absolute;top:2px;bottom:2px;border-radius:999px}
.advm-fill.h{background:linear-gradient(90deg,rgba(var(--ch),.5),rgb(var(--ch)));box-shadow:0 0 12px rgba(var(--ch),.8)}
.advm-fill.a{background:linear-gradient(270deg,rgba(var(--ca),.5),rgb(var(--ca)));box-shadow:0 0 12px rgba(var(--ca),.8)}
.fx-full .advm-fill,.fx-lite .advm-fill{animation:advgrow .9s var(--ease) both}
@keyframes advgrow{from{clip-path:inset(0 50% 0 50%)}to{clip-path:inset(0 0 0 0)}}

/* ---------- HMM regime nodes ---------- */
.rn{margin:6px 0 10px}
.rn-h{font:800 11px var(--tech);letter-spacing:.12em;color:#fff;margin-bottom:6px}
.rn-tr{margin-left:6px;padding:1px 8px;border-radius:999px;border:1px solid var(--purple);color:var(--purple);font-size:10px}
.rn-row{display:flex;align-items:center;gap:0}
.rn-link{flex:1;height:2px;min-width:10px;background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,.25),rgba(255,255,255,.08))}
.rn-node{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:78px;padding:8px 6px 6px;border-radius:12px;border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(180deg,#120c22,#07040f);color:var(--dim);transition:transform .5s var(--ease),box-shadow .5s,color .5s,border-color .5s}
.rn-node i{width:14px;height:14px;border-radius:50%;background:#2a2340;box-shadow:inset 0 1px 2px rgba(0,0,0,.8)}
.rn-node .l{font:800 10px var(--tech);letter-spacing:.1em}
.rn-node .p{font:800 15px var(--mono);color:#cfc6e6}
.rn-node .cur{font:800 8.5px var(--tech);letter-spacing:.14em;color:#000;background:#fff;border-radius:4px;padding:0 4px;margin-top:2px}
.rn-node.cold{--rc:30,227,255}.rn-node.norm{--rc:176,107,255}.rn-node.hot{--rc:255,159,46}
.rn-node.on{color:#fff;border-color:rgba(var(--rc),.9);transform:translateY(-3px) scale(1.06);box-shadow:0 12px 22px rgba(0,0,0,.6),0 0 18px rgba(var(--rc),.55)}
.rn-node.on i{background:rgb(var(--rc));box-shadow:0 0 10px rgb(var(--rc)),0 0 20px rgba(var(--rc),.7)}
.rn-node.on .p{color:#fff}
.fx-full .rn-node.on,.fx-lite .rn-node.on{animation:nodeon 1.1s var(--ease) both}
.fx-full .rn-node.was i,.fx-lite .rn-node.was i{animation:nodewas 1.4s ease-out both}
@keyframes nodeon{0%{transform:none;box-shadow:none}100%{transform:translateY(-3px) scale(1.06)}}
@keyframes nodewas{0%{background:rgb(var(--rc));box-shadow:0 0 12px rgb(var(--rc))}100%{background:#2a2340;box-shadow:none}}
.rn-team.compact{padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06)}
.rn-tn{display:flex;align-items:center;gap:8px;margin-bottom:4px;font:800 14px Inter}
@media (max-width:600px){.rn-node{min-width:0;flex:none;width:30%;padding:7px 3px 5px}.rn-link{min-width:4px}}

/* ---------- strength chart ---------- */
.strc{padding:14px 14px 8px;border-radius:16px;background:var(--glass),radial-gradient(500px 220px at 0% 0%,rgba(var(--tc),.16),transparent 60%),#07040f;border:1px solid rgba(var(--tc),.35);box-shadow:var(--L1)}
.strc-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap}
.strc-v{font:900 36px var(--tech);color:#fff;text-shadow:0 0 14px rgba(var(--tc),.7)}.strc-v span{font-size:15px}
.strc-svg{width:100%;height:auto;margin-top:8px;overflow:visible}
.strc-svg text{fill:var(--dim);font:600 10px var(--mono)}

/* ---------- team page header: digital locker-room display in team colors ---------- */
.team-hero{position:relative;overflow:hidden;border-radius:20px!important;background:var(--glass),radial-gradient(700px 300px at 0% 0%,rgba(var(--tc),.3),transparent 60%),linear-gradient(160deg,#120a22,#05030b)!important;
  border:1px solid rgba(var(--tc),.6)!important;box-shadow:var(--L3),0 0 30px rgba(var(--tc),.3)!important}
.team-hero:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px)}

/* ---------- odds wall ---------- */
.wall{border-radius:18px;padding:0 0 6px;background:linear-gradient(180deg,#0b0814,#030207);border:1px solid #2c2246;box-shadow:var(--L2),inset 0 0 40px rgba(var(--acc2-rgb),.06);overflow:hidden}
.wall-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:2px solid var(--gold);
  background:linear-gradient(180deg,#14100a,#000);font:900 13px var(--tech);letter-spacing:.24em;color:var(--gold);text-shadow:var(--y-glow)}
.wall-h .tiny{letter-spacing:.08em;color:var(--dim);text-shadow:none;font-weight:700}
.wall .tw{overflow-x:auto}
.wall-t{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:13px;min-width:720px}
.wall-t th{font:800 9.5px var(--tech);letter-spacing:.14em;color:var(--dim);text-align:left;padding:6px 10px}
.wall-t td{padding:8px 10px;background:rgba(255,255,255,.025);border-top:1px solid rgba(255,255,255,.05);border-bottom:1px solid rgba(0,0,0,.6);white-space:nowrap}
.wall-t tr{cursor:pointer;transition:transform .2s var(--ease)}
.wall-t tr:hover td{background:rgba(var(--acc2-rgb),.07)}
.fx-full .wall-t tbody tr:hover{transform:translateX(3px)}
.wall-t tr:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.wall-t tr.off td{background:rgba(255,210,63,.07);border-top-color:rgba(255,210,63,.35)}
.wall-t .mu{font:700 13px Inter;color:#fff}
.wall-t .mono{font-family:var(--mono);font-weight:700;color:#fff}
.wall-t .mono.b{color:var(--blue)}.wall-t .mono.g{color:var(--green)}.wall-t .mono.d{color:var(--dim)}
.wmv{margin-left:4px;font-size:10px}.wmv.up{color:var(--green)}.wmv.dn{color:var(--red)}

/* ---------- MY CARD tickets ---------- */
.ticket{border-radius:14px 14px 6px 6px;border-top:3px solid var(--pink);background:var(--glass),linear-gradient(170deg,#191127,#0b0714)!important;
  -webkit-mask:radial-gradient(circle 7px at 0 calc(100% - 46px),transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% calc(100% - 46px),transparent 98%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 7px at 0 calc(100% - 46px),transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% calc(100% - 46px),transparent 98%,#000) right/51% 100% no-repeat}
.ticket .tk-foot{margin:10px -14px -12px;padding:8px 14px;border-top:2px dashed rgba(255,255,255,.14);display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(0,0,0,.25)}
.tickets{filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
.tickets .ticket:nth-child(odd){transform:rotate(-.25deg)}.tickets .ticket:nth-child(even){transform:rotate(.25deg)}
.fx-off .tickets .ticket{transform:none}
.ticket .tk-l1{display:flex;align-items:center;gap:8px}
.ticket .pay{font:800 13px var(--mono);color:var(--green)}

/* ---------- props: silhouette avatars (no player photos) ---------- */
.pav{position:relative;flex:none;display:grid;place-items:center;width:58px;height:58px;border-radius:50%;overflow:visible;
  background:radial-gradient(circle at 50% 30%,rgba(var(--tc),.45),rgba(var(--tc),.12) 60%,#0b0716);border:2px solid rgba(var(--tc),.8);box-shadow:0 0 14px rgba(var(--tc),.4),0 8px 14px rgba(0,0,0,.5)}
.pav svg{position:absolute;inset:6px;fill:rgba(0,0,0,.45)}
.pav b{position:relative;font:900 16px var(--tech);color:#fff;text-shadow:0 1px 3px #000}
.pav img{position:absolute;right:-6px;bottom:-6px;width:24px;height:24px;border-radius:50%;background:#0b0716;padding:2px;border:1px solid rgba(255,255,255,.2)}

/* ---------- rankings + movers ---------- */
.rankboard tbody tr{transition:transform .2s var(--ease)}
.rankboard tbody tr:nth-child(-n+3) td{background:rgba(255,210,63,.05)}
.fx-full .rankboard tbody tr:hover{transform:translateX(3px)}
.fx-full .board .row,.fx-lite .board .row{animation:rowin .5s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes rowin{from{opacity:0;transform:translate3d(0,6px,0) scale(.98)}to{opacity:1;transform:none}}

/* ---------- charts: subtle elevation ---------- */
.lc-shadow{filter:blur(2px)}

/* modal: the matchup header scrolls away; only the tab row stays pinned */
.sheet .hd.mhd{position:relative}
.sheet>.mtabs.pin{position:sticky;top:0;z-index:3;margin:0;padding:8px 16px;background:linear-gradient(180deg,#140c25 80%,rgba(20,12,37,0));display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.mh-vs{min-width:44px;text-align:center;font-size:clamp(22px,3.6vw,34px)}

/* =====================================================================================================
   KJ's Picks LANDING: the sportsbook stage, the HTML screen wall (real data, framed by the 3D room),
   the seat console, loader, 2.5D fallback and the floating glass sidebar console.
   ===================================================================================================== */
/* while the sportsbook is on screen the room IS the header: the page header steps aside, the ticker becomes the LED ribbon */
html body.ld-on header.hero,html body.ld-on #lgbar,html body.ld-on #stats,html body.ld-on #tabs{display:none!important}
body.ld-on .ticker{position:fixed;left:0;right:0;top:0;transform:translateY(-110%);transition:transform .45s var(--ease)}
body.ld-on.ld-past .ticker{transform:none}

.ld{position:relative;width:var(--ldw,100vw);left:50%;margin-left:calc(var(--ldw,100vw) / -2);margin-top:-6px}
.ld-stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#05030b;isolation:isolate}
.ld-canvas,.ld-canvas canvas{position:absolute;inset:0;display:block}
.ld-vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.55))}

/* ---------- the screen wall (positions here define where the 3D frames go) ---------- */
.ld-wall{position:absolute;left:4%;right:4%;top:5%;bottom:30%;display:grid;grid-template-rows:34px minmax(0,1fr) 22%;gap:1.3vh;
  opacity:0;pointer-events:none;transition:opacity .7s var(--ease);will-change:transform}
.seated .ld-wall{opacity:1;pointer-events:auto}
.lw-p{position:relative;min-height:0;overflow:hidden;padding:8px 10px;border-radius:4px;background:linear-gradient(180deg,#090616,#03020a);
  color:#efeaff;font:600 12px/1.35 Inter;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 0 1px 0 rgba(255,255,255,.1);cursor:pointer;transition:box-shadow .25s,transform .25s}
.lw-p:hover,.lw-p:focus-visible{box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 0 24px rgba(var(--acc2-rgb),.35);outline:none}
.lw-p:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
.lw-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);gap:1.1vw;min-height:0}
.lw-col{display:grid;gap:1.3vh;min-height:0;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.lw-col.c{grid-template-rows:auto minmax(0,1fr)}
.lw-bot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.1vw;min-height:0}
.lw-h{display:flex;align-items:baseline;gap:8px;font:900 11px var(--tech);letter-spacing:.16em;color:#fff;margin-bottom:5px;white-space:nowrap;overflow:hidden}
.lw-h small{font:600 10px Inter;letter-spacing:0;color:var(--dim)}
.lw-h.ncaa{color:#1ee3ff;text-shadow:0 0 8px rgba(30,227,255,.6)}.lw-h.nfl{color:var(--gold);text-shadow:0 0 8px rgba(255,210,63,.55)}.lw-h.gold{color:var(--gold)}
.lw-r{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,.7fr)) 14px;gap:6px;align-items:center;padding:3px 4px;border-bottom:1px solid rgba(255,255,255,.05);font:700 11.5px var(--mono);white-space:nowrap}
.lw-r:hover{background:rgba(255,255,255,.06)}
.lw-r .mu{overflow:hidden;text-overflow:ellipsis;font-family:Inter}.lw-r .b{color:var(--blue)}.lw-r .g{color:var(--green)}.lw-r .d{color:var(--dim)}.lw-r .y{color:var(--gold)}
.lw-r.rk{grid-template-columns:22px minmax(0,1.6fr) .6fr .9fr}.lw-r.rk .logo{width:16px;height:16px;vertical-align:middle}
.lw-r.mv{grid-template-columns:14px minmax(0,1.4fr) 1fr}.lw-r.lv{grid-template-columns:auto minmax(0,1.4fr) minmax(0,1fr)}
.rg{font-style:normal;font:800 9px var(--tech);padding:1px 5px;border-radius:4px;border:1px solid}.rg.BREAKOUT{color:var(--orange)}.rg.SLUMP{color:var(--blue)}.rg.NORMAL{color:var(--purple)}
.lw-none,.lw-lock{padding:10px 4px;color:var(--dim);font:800 11px var(--tech);letter-spacing:.1em}
.lw-lock a{color:var(--gold)}
/* ribbon: the ticker built into the wall */
.lw-rib{padding:0;display:flex;align-items:center;background:#000;font:700 13px var(--mono)}
.lw-rib .tk-t{height:100%}
.lw-rib .tk{height:100%;padding:0 16px;border-right:1px solid rgba(255,255,255,.08)}
.lw-rib .tk .k{text-shadow:0 0 8px currentColor}
/* record scoreboard */
.lw-recs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lw-rec{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border-radius:6px;background:rgba(255,255,255,.03)}
.lw-rec .lg.all{background:#fff;color:#000}
.lw-rec b{font:900 clamp(18px,2.1vw,28px)/1.05 var(--tech);color:#fff;text-shadow:0 0 12px rgba(255,255,255,.35)}
.lw-rec i{font:800 12px var(--mono);font-style:normal}.lw-rec i.g{color:var(--green)}.lw-rec i.r{color:var(--red)}
/* the centerpiece: OFFICIAL PLAYS */
.lw-off{padding:10px 12px;background:radial-gradient(120% 80% at 50% 0%,rgba(255,210,63,.13),transparent 60%),linear-gradient(180deg,#140d04,#06040a);
  box-shadow:inset 0 0 0 1px rgba(255,210,63,.45),inset 0 0 30px rgba(255,210,63,.08)}
.lw-off:hover{box-shadow:inset 0 0 0 1px rgba(255,210,63,.8),0 0 34px rgba(255,210,63,.4)}
.lw-oh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:900 clamp(13px,1.4vw,18px) var(--tech);letter-spacing:.16em;color:var(--gold);text-shadow:0 0 12px rgba(255,210,63,.7);margin-bottom:8px}
.lw-oh .tiny{font:700 10px Inter;letter-spacing:0;color:var(--dim);text-shadow:none}
.lw-pick{position:relative;padding:8px 10px;margin-bottom:7px;border-radius:10px;background:rgba(255,210,63,.06);border:1px solid rgba(255,210,63,.4);box-shadow:0 6px 14px rgba(0,0,0,.5);transition:transform .2s,box-shadow .2s}
.lw-pick:hover,.lw-pick:focus-visible{transform:translateY(-2px);box-shadow:0 10px 20px rgba(0,0,0,.6),0 0 16px rgba(255,210,63,.45);outline:none}
.lw-pk1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lw-pk1 b{font:400 clamp(19px,2.2vw,30px)/1 var(--disp);letter-spacing:.04em;color:#fff;text-shadow:0 0 10px rgba(255,210,63,.5)}
.lw-pk1 .o{font:800 13px var(--mono);color:var(--dim)}.lw-pk1 .st{margin-left:auto}
.lw-pk1 .emb img,.lw-pk1 .emb .logo{width:24px;height:24px}
.lw-pk1 .nw{font:900 9.5px var(--tech);letter-spacing:.14em;color:#000;background:var(--gold);border-radius:4px;padding:1px 5px}
.lw-pk2{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;font:700 11.5px var(--mono);color:var(--dim)}.lw-pk2 b{color:#fff}.lw-pk2 b.g{color:var(--green)}
.lw-pick.live{border-color:var(--green);box-shadow:0 0 0 1px rgba(57,255,136,.4),0 0 18px rgba(57,255,136,.3)}
.lw-pick .trk{margin-top:6px}
.lw-pick.fresh{animation:freshin 1.4s var(--ease) both}
.lw-off.has-fresh{animation:offglow 2.4s ease-out 1}
@keyframes freshin{0%{opacity:0;transform:translateX(40px) scale(.97)}60%{opacity:1;box-shadow:0 0 30px rgba(255,210,63,.9)}100%{transform:none}}
@keyframes offglow{30%{box-shadow:inset 0 0 0 2px var(--gold),0 0 60px rgba(255,210,63,.8)}}
.lw-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:calc(100% - 30px);text-align:center;font:600 12.5px/1.45 Inter;color:#ddd5f2}
.lw-empty b{font:900 clamp(13px,1.5vw,18px) var(--tech);letter-spacing:.14em;color:#fff}
.lw-empty .countdown{color:var(--blue);font-family:var(--mono)}
.lw-more{display:block;text-align:right;font:800 11px var(--tech);color:var(--gold)}
.lw-nfl{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lw-nfl>div{display:flex;flex-direction:column;padding:6px;border-radius:6px;background:rgba(255,255,255,.03)}
.lw-nfl .k{font:800 9px var(--tech);letter-spacing:.12em;color:var(--dim)}.lw-nfl b{font:900 20px var(--tech);color:#fff}.lw-nfl b.g{color:var(--green)}.lw-nfl b.r{color:var(--red)}
.lw-note{margin-top:6px;font:500 11px/1.4 Inter;color:var(--dim)}

/* ---------- seat console: on the coffee table ---------- */
.ld-console{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);display:flex;align-items:stretch;gap:10px;opacity:0;pointer-events:none;transition:opacity .7s var(--ease) .15s;z-index:3}
.seated .ld-console{opacity:1;pointer-events:auto}
.ld-lg{display:flex;gap:4px;padding:5px;border-radius:14px;background:linear-gradient(180deg,#0f0b1c,#04020a);border:1px solid #2c2246;box-shadow:inset 0 2px 8px rgba(0,0,0,.85),0 14px 30px rgba(0,0,0,.6)}
.ld-lg button{padding:10px 16px;border-radius:10px;border:1px solid #2a2140;background:linear-gradient(180deg,#1b1530,#0b0816);color:#b9aedb;font:900 13px var(--tech);letter-spacing:.14em;cursor:pointer}
.ld-lg button.on.ncaa{background:#1ee3ff;color:#000;box-shadow:0 0 18px rgba(30,227,255,.7)}.ld-lg button.on.nfl{background:var(--gold);color:#000;box-shadow:0 0 18px rgba(255,210,63,.7)}
.ld-lg button.on.all{background:#fff;color:#000;box-shadow:0 0 18px rgba(255,255,255,.5)}
.ld-lg button:focus-visible,.ld-mon:focus-visible{outline:2px solid #fff;outline-offset:2px}
.ld-mon{display:flex;flex-direction:column;justify-content:center;padding:7px 14px;border-radius:12px;border:1px solid rgba(255,46,136,.6);background:linear-gradient(180deg,rgba(28,10,26,.92),rgba(8,4,12,.92));
  color:#fff;text-decoration:none;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.55),0 0 14px rgba(255,46,136,.3);font:inherit;text-align:left}
.ld-mon .k{font:800 9.5px var(--tech);letter-spacing:.14em;color:#ff7ab8}.ld-mon b{font:900 13px var(--tech);letter-spacing:.06em}.ld-mon .d{font:600 11px var(--mono);color:var(--dim)}
.ld-mon.al{border-color:rgba(30,227,255,.6);box-shadow:0 10px 24px rgba(0,0,0,.55),0 0 14px rgba(30,227,255,.3)}.ld-mon.al .k{color:var(--blue)}
.ld-mon.ld-replay{border-color:rgba(255,255,255,.25);box-shadow:0 10px 24px rgba(0,0,0,.55)}.ld-mon.ld-replay .k{color:var(--dim)}

/* ---------- walk-in UI: hint, skip, loader, mobile menu ---------- */
.ld-ui{position:absolute;inset:0;pointer-events:none;z-index:4}
.ld-ui>*{pointer-events:auto}
.ld-hint{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);white-space:nowrap;font:900 13px var(--tech);letter-spacing:.3em;color:#fff;text-shadow:0 0 12px rgba(255,46,136,.9);transition:opacity .5s;pointer-events:none}
.ld-hint span{display:block;text-align:center;animation:tkarrow 1.6s ease-in-out infinite}
.ld-skip{position:absolute;right:18px;bottom:22px;padding:10px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(5,3,11,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  color:#fff;font:800 11.5px var(--tech);letter-spacing:.14em;cursor:pointer;transition:opacity .4s}
.ld-skip:hover,.ld-skip:focus-visible{border-color:var(--gold);color:var(--gold);outline:none}
.ld-skip.gone{opacity:0;pointer-events:none}
.ld-menu{position:absolute;left:12px;top:12px;display:none}
@media (max-width:1100px){.ld-menu{display:inline-flex}}
.ld-load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(60% 50% at 50% 45%,rgba(255,46,136,.18),transparent 70%),#05030b;transition:opacity .8s var(--ease),visibility .8s}
.ld-load.done{opacity:0;visibility:hidden}
.ld-logo{font:400 clamp(54px,10vw,110px)/1 var(--disp);letter-spacing:.06em;color:#fff6fb;text-shadow:0 0 2px #fff,0 0 16px rgba(255,46,136,.9),0 0 44px rgba(255,46,136,.5)}
.ld-lt{font:900 13px var(--tech);letter-spacing:.34em;color:var(--gold)}
.ld-ls{display:flex;flex-direction:column;align-items:center;gap:4px;font:700 11px var(--mono);color:var(--dim)}.ld-ls span:first-child{color:var(--green)}
.fx-full .ld-ls span:last-child,.fx-lite .ld-ls span:last-child{animation:pulse 1.2s infinite}

/* ---------- phones: only the screens that matter most ---------- */
@media (max-width:760px){
  .ld-wall{left:3%;right:3%;top:8%;bottom:30%;grid-template-rows:30px minmax(0,1fr)}
  .lw-grid{grid-template-columns:minmax(0,1fr)}.lw-col.l,.lw-col.r,.lw-bot{display:none}
  .ld-console{bottom:76px;width:94%;justify-content:center;flex-wrap:wrap;gap:6px}.ld-mon{padding:6px 10px}.ld-mon.ld-replay{display:none}.ld-lg button{padding:9px 12px}
  .ld-skip{bottom:86px}.ld-hint{bottom:110px}
}

/* ---------- 2.5D fallback (reduced motion, no WebGL, slow device or a failed load): same live screens, layered room ---------- */
.ld.ld-flat{height:auto!important;margin-top:0}
.ld-flat .ld-stage{position:relative;height:auto;min-height:100vh;padding:5vh 4% 18vh;
  background:linear-gradient(180deg,transparent 0 3%,rgba(255,210,63,.25) 3.2%,transparent 3.6%),repeating-linear-gradient(90deg,rgba(159,220,255,.12) 0 3px,transparent 3px 12.5%) 0 0/100% 4%  no-repeat,
    radial-gradient(70% 45% at 50% 40%,rgba(255,210,63,.12),transparent 70%),radial-gradient(40% 50% at 0% 50%,rgba(30,227,255,.14),transparent 70%),radial-gradient(40% 50% at 100% 50%,rgba(255,176,32,.12),transparent 70%),
    linear-gradient(180deg,#0b0712 0%,#08050e 70%,#0d0912 70.2%,#06040a 100%)}
.ld-flat .ld-stage:after{content:"";position:absolute;left:0;right:0;bottom:0;height:16vh;pointer-events:none;
  background:radial-gradient(60% 120% at 12% 120%,#2a1a14 0 50%,transparent 51%),radial-gradient(60% 120% at 88% 120%,#2a1a14 0 50%,transparent 51%),linear-gradient(180deg,transparent,rgba(0,0,0,.6))}
.ld-flat .ld-wall{position:relative;inset:auto;opacity:1;pointer-events:auto;height:min(78vh,760px);transform:none!important}
.ld-flat .lw-p{box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 0 0 3px rgba(var(--acc2-rgb),.25),0 18px 30px rgba(0,0,0,.55)}
.ld-flat .lw-off{box-shadow:inset 0 0 0 1px rgba(255,210,63,.6),0 0 0 4px rgba(255,210,63,.35),0 0 40px rgba(255,210,63,.3)}
.ld-flat .ld-console{position:relative;left:auto;bottom:auto;transform:none;opacity:1;pointer-events:auto;justify-content:center;margin-top:18px;z-index:2}
.ld-flat .ld-canvas,.ld-flat .ld-hint,.ld-flat .ld-skip,.ld-flat .ld-load,.ld-flat .ld-replay,.ld-flat .ld-vig{display:none}
.ld-flat .ld-ui{position:static}
@media (max-width:760px){.ld-flat .ld-wall{height:auto}.ld-flat .lw-off{min-height:240px}}

/* ---------- sidebar: a floating glass control console beside the view ---------- */
@media (min-width:1101px){
  body{padding-left:240px}
  #side{top:48px;left:10px;bottom:10px;width:222px;border-radius:18px;padding-top:12px;border:1px solid rgba(var(--acc-rgb),.35);
    background:linear-gradient(180deg,rgba(16,10,32,.72),rgba(6,4,14,.78));-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
    box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08),0 0 24px rgba(var(--acc-rgb),.18);transition:top .45s var(--ease),border-color .6s}
  body.ld-on:not(.ld-past) #side{top:10px}
}
#side a.it{transition:background .2s,transform .2s}
#side a.it:hover{transform:translateX(2px)}
#side .grp.all.console{display:flex;justify-content:space-between}
.lw-off{overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,210,63,.5) transparent}
.lw-off::-webkit-scrollbar{width:6px}.lw-off::-webkit-scrollbar-thumb{background:rgba(255,210,63,.5);border-radius:3px}

</style>

<div id="env" aria-hidden="true"><div class="l env-glow g-all"></div><div class="l env-glow g-ncaa"></div><div class="l env-glow g-nfl"></div><div class="l env-glow g-team"></div><div class="l env-boards"><i></i><i></i><i></i></div><div class="l env-strips"></div><div class="l env-floor"></div></div>
<script>/* KJ's Picks FX layer - PRESENTATION ONLY.
   Reads no model data and makes no decisions. Every effect is optional: if this file fails or the device is slow,
   the site renders exactly as before. Levels (set on <html>):
     fx-full  desktop with a fine pointer: card tilt (max 3deg), light parallax, animated lighting
     fx-lite  phones, tablets, low-power or slow devices: depth, glows and small transitions only
     fx-off   prefers-reduced-motion: no tilt, no parallax, no ambient animation (all features still work)
   Override for testing: ?fx=full | ?fx=lite | ?fx=off  */
(function () {
  "use strict";
  const root = document.documentElement;
  const mq = q => { try { return window.matchMedia(q).matches; } catch (e) { return false; } };
  const nv = navigator;
  function detect() {
    const forced = (location.search.match(/[?&]fx=(full|lite|off)\b/) || [])[1];
    if (forced) return forced;
    try { const pref = JSON.parse(localStorage.getItem("cfbedge.fxpref") || "null"); if (pref && pref !== "auto") return pref; } catch (e) {}   // the visitor's own setting
    if (mq("(prefers-reduced-motion: reduce)")) return "off";
    const weak = (nv.hardwareConcurrency || 8) <= 4 || (nv.deviceMemory || 8) <= 4 || !!(nv.connection && nv.connection.saveData);
    if (weak || mq("(pointer: coarse)") || !mq("(hover: hover)")) return "lite";
    return "full";
  }
  let level = detect();
  function setLevel(l) {
    root.classList.remove("fx-full", "fx-lite", "fx-off");
    root.classList.add("fx-" + l);
    root.dataset.fx = l;
    level = l;
    if (l !== "full") resetAll();
  }

  /* ---------- tilt + light parallax (desktop only, one shared listener, one rAF) ---------- */
  let active = null, raf = 0, px = innerWidth / 2, py = innerHeight / 2, sy = 0;
  const MAXDEG = 3;
  function reset(el) { if (!el) return; el.style.removeProperty("--rx"); el.style.removeProperty("--ry"); el.classList.remove("tilting"); }
  function resetAll() { reset(active); active = null; const env = document.getElementById("env"); if (env) { env.style.removeProperty("--px"); env.style.removeProperty("--py"); } }
  function frame() {
    raf = 0;
    if (level !== "full") return;
    const env = document.getElementById("env");
    if (env) {                                   // background lights drift a few pixels; cards and text stay put
      env.style.setProperty("--px", ((px / innerWidth - .5) * -14).toFixed(1) + "px");
      env.style.setProperty("--py", ((py / innerHeight - .5) * -10 - Math.min(sy * .02, 30)).toFixed(1) + "px");
    }
    if (active && active.isConnected) {
      const r = active.getBoundingClientRect();
      const x = Math.max(-.5, Math.min(.5, (px - r.left) / r.width - .5)), y = Math.max(-.5, Math.min(.5, (py - r.top) / r.height - .5));
      const m = Math.min(MAXDEG, +active.dataset.tilt || MAXDEG);
      active.style.setProperty("--ry", (x * m * 2).toFixed(2) + "deg");
      active.style.setProperty("--rx", (-y * m * 2).toFixed(2) + "deg");
      active.style.setProperty("--mx", ((x + .5) * 100).toFixed(1) + "%");
      active.style.setProperty("--my", ((y + .5) * 100).toFixed(1) + "%");
      active.classList.add("tilting");
    }
  }
  const kick = () => { if (!raf) raf = requestAnimationFrame(frame); };
  document.addEventListener("pointermove", e => {
    if (level !== "full" || e.pointerType === "touch") return;
    px = e.clientX; py = e.clientY;
    const t = e.target && e.target.closest ? e.target.closest("[data-tilt]") : null;
    if (t !== active) { reset(active); active = t; }
    kick();
  }, {passive: true});
  document.addEventListener("pointerleave", () => { reset(active); active = null; }, {passive: true});
  window.addEventListener("blur", () => { reset(active); active = null; });
  window.addEventListener("scroll", () => { sy = scrollY; if (level === "full") kick(); }, {passive: true});

  /* ---------- pause ambient animation when the tab is hidden (battery) ---------- */
  document.addEventListener("visibilitychange", () => root.classList.toggle("fx-paused", document.hidden));

  /* ---------- slow-device fallback: measure frame time once, drop to lite if the page is struggling ---------- */
  function sampleFps() {
    if (level !== "full" || !window.requestAnimationFrame) return;
    let n = 0, t0 = 0;
    const step = t => { if (!t0) t0 = t; if (++n < 90) return requestAnimationFrame(step);
      const avg = (t - t0) / (n - 1);
      if (avg > 34 && !document.hidden) setLevel("lite"); };
    requestAnimationFrame(step);
  }

  /* ---------- small, reusable motion primitives ---------- */
  function pulse(el, kind) {          // final result: WIN green/gold, LOSS red, PUSH blue/white - once, then settle
    if (!el || level === "off") return;
    const c = "fx-pulse-" + kind; el.classList.remove(c); void el.offsetWidth; el.classList.add(c);
    setTimeout(() => el.classList.remove(c), 1800);
  }
  function changed(el, dir) {          // a value changed: old fades back, new steps forward, brief glow
    if (!el || level === "off") return;
    const c = "fx-chg" + (dir > 0 ? " up" : dir < 0 ? " dn" : "");
    el.classList.remove("fx-chg", "up", "dn"); void el.offsetWidth; el.className += " " + c;
    setTimeout(() => el.classList.remove("fx-chg", "up", "dn"), 1400);
  }
  function toast(html, opts) {         // level-4 alert that slides in from the corner; never blocks the page
    opts = opts || {};
    let box = document.getElementById("fxtoasts");
    if (!box) { box = document.createElement("div"); box.id = "fxtoasts"; box.setAttribute("aria-live", "polite"); document.body.appendChild(box); }
    const t = document.createElement("div");
    t.className = "fx-toast " + (opts.cls || ""); t.setAttribute("role", "status");
    t.innerHTML = html + '<button class="fx-x" aria-label="Dismiss">×</button>';
    const close = () => { t.classList.remove("in"); setTimeout(() => t.remove(), 350); };
    t.querySelector(".fx-x").onclick = e => { e.stopPropagation(); close(); };
    if (opts.onclick) { t.style.cursor = "pointer"; t.tabIndex = 0; t.onclick = () => { opts.onclick(); close(); };
      t.onkeydown = e => { if (e.key === "Enter") { opts.onclick(); close(); } }; }
    box.appendChild(t);
    requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add("in")));
    setTimeout(close, opts.ms || 9000);
    return t;
  }
  let gl = null;
  function webgl() {                   // checked lazily, only by the later visualizations that might use it
    if (gl !== null) return gl;
    try { const c = document.createElement("canvas"); gl = !!(window.WebGLRenderingContext && (c.getContext("webgl") || c.getContext("experimental-webgl"))); }
    catch (e) { gl = false; }
    return gl;
  }

  setLevel(level);
  if (document.readyState === "complete") sampleFps(); else window.addEventListener("load", sampleFps);
  try {                                // follow the OS setting live
    const rm = window.matchMedia("(prefers-reduced-motion: reduce)");
    rm.addEventListener && rm.addEventListener("change", () => setLevel(detect()));
  } catch (e) {}
  window.KJFX = {get level() { return level; }, setLevel, redetect: () => setLevel(detect()), pulse, changed, toast, webgl};
})();

/* KJ's Picks LANDING: a first-person, scroll-driven walk into a stylized 3D KJ's Picks sportsbook.
   PRESENTATION ONLY. It draws an environment and moves a camera. It never reads the ledger or calculates anything:
   the app hands it short display strings (feeds) and an HTML "screen wall" whose panels it frames in 3D.
   All readable numbers stay in that HTML (crisp, clickable, accessible). If WebGL or the CDN fails, mount() rejects
   and the app shows the flat 2.5D version instead - the website keeps working either way.
   Coordinates: metres. Building front at z=0, interior back wall near z=-50, seated camera at z=-30. */
(function () {
  "use strict";
  const V = "0.160.0", CDN = "https://cdn.jsdelivr.net/npm/three@" + V + "/";
  let S = null;                                   // the one mounted instance

  function supported() {
    try { const c = document.createElement("canvas"); return !!(window.WebGLRenderingContext && (c.getContext("webgl2") || c.getContext("webgl"))); }
    catch (e) { return false; }
  }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error("timeout")), ms))]);

  async function loadThree(full) {
    const T = await withTimeout(import(CDN + "build/three.module.min.js"), 15000);
    const out = {T};
    if (full) {
      try {
        const [ec, rp, ub, op] = await withTimeout(Promise.all(["postprocessing/EffectComposer.js", "postprocessing/RenderPass.js",
          "postprocessing/UnrealBloomPass.js", "postprocessing/OutputPass.js"].map(p => import(CDN + "examples/jsm/" + p))), 12000);
        Object.assign(out, {EffectComposer: ec.EffectComposer, RenderPass: rp.RenderPass, UnrealBloomPass: ub.UnrealBloomPass, OutputPass: op.OutputPass});
      } catch (e) { /* bloom is optional */ }
