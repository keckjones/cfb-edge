    return out;
  }

  /* ------------------------------------------------------------------ small builders */
  function kit(T) {
    const neon = (hex, k = 2.2) => new T.MeshBasicMaterial({color: new T.Color(hex).multiplyScalar(k)});
    const std = (hex, o = {}) => new T.MeshStandardMaterial(Object.assign({color: hex, roughness: .6, metalness: .2}, o));
    const box = (g, w, h, d, m, x, y, z) => { const b = new T.Mesh(new T.BoxGeometry(w, h, d), m); b.position.set(x, y, z); g.add(b); return b; };
    const plane = (g, w, h, m, x, y, z) => { const p = new T.Mesh(new T.PlaneGeometry(w, h), m); p.position.set(x, y, z); g.add(p); return p; };
    function ctex(w, h, draw) {
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const x = c.getContext("2d"); draw(x, w, h);
      const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; t.anisotropy = 4;
      return t;
    }
    function glowTex(rgb) {          // soft radial light pool, used additively to fake reflections and halos
      return ctex(128, 128, (x, w, h) => { const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
        g.addColorStop(0, `rgba(${rgb},1)`); g.addColorStop(.35, `rgba(${rgb},.45)`); g.addColorStop(1, `rgba(${rgb},0)`); x.fillStyle = g; x.fillRect(0, 0, w, h); });
    }
    const add = (tex, k = 1) => new T.MeshBasicMaterial({map: tex, transparent: true, blending: T.AdditiveBlending, depthWrite: false, color: new T.Color(1, 1, 1).multiplyScalar(k)});
    return {neon, std, box, plane, ctex, glowTex, add};
  }

  // text panel drawn into a canvas (used while walking; the HTML takes over when seated)
  function drawScreen(x, w, h, title, lines, accent) {
    const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#0d0a1c"); g.addColorStop(1, "#05040b");
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    x.strokeStyle = accent; x.lineWidth = Math.max(4, w / 120); x.strokeRect(0, 0, w, h);
    const fs = Math.max(14, Math.min(h / 9, w / 14));
    x.fillStyle = accent; x.font = `700 ${fs}px Orbitron, Consolas, monospace`; x.textBaseline = "top";
    x.fillText(String(title || "").toUpperCase(), fs * .6, fs * .5);
    x.fillStyle = "#e9e3ff"; x.font = `600 ${fs * .72}px "JetBrains Mono", Consolas, monospace`;
    (lines || []).slice(0, Math.floor((h - fs * 2) / (fs * .95))).forEach((l, i) => x.fillText(String(l).slice(0, Math.floor(w / (fs * .45))), fs * .6, fs * 1.9 + i * fs * .95));
  }

  /* ------------------------------------------------------------------ the world */
  function buildWorld(T, K, F, lite) {
    const W = {root: new T.Group(), anim: [], ext: [], int: [], doors: [], clickables: []};
    const g = W.root, R = (a, b) => a + Math.random() * (b - a);

    // sky + far skyline + stars
    W.sky = K.ctex(4, 512, (x, w, h) => { const gr = x.createLinearGradient(0, 0, 0, h);
      gr.addColorStop(0, "#020108"); gr.addColorStop(.55, "#0d0626"); gr.addColorStop(.8, "#2a0d3d"); gr.addColorStop(1, "#3b1240"); x.fillStyle = gr; x.fillRect(0, 0, w, h); });
    const winTex = (lit, cols) => K.ctex(128, 256, (x, w, h) => { x.fillStyle = "#06070e"; x.fillRect(0, 0, w, h);
      for (let r = 0; r < 32; r++) for (let c = 0; c < 8; c++) if (Math.random() < lit) { x.fillStyle = cols[(Math.random() * cols.length) | 0]; x.fillRect(c * 16 + 3, r * 8 + 2, 10, 4); } });
    const cityMat = new T.MeshBasicMaterial({map: winTex(.24, ["#ffcf7a", "#7fd8ff", "#c79bff", "#ffffff"]), color: new T.Color(.5, .5, .6)});
    const nCity = lite ? 26 : 60;
    for (let i = 0; i < nCity; i++) { const h = R(20, 120), w = R(12, 28);
      const b = K.box(g, w, h, R(10, 20), cityMat, R(-320, 320), h / 2, R(-260, -140)); b.material = cityMat; }
    for (let i = 0; i < (lite ? 10 : 24); i++) { const h = R(15, 70); K.box(g, R(10, 22), h, 14, cityMat, (i % 2 ? 1 : -1) * R(90, 220), h / 2, R(-100, 120)); }
    const sp = new Float32Array((lite ? 150 : 400) * 3);
    for (let i = 0; i < sp.length; i += 3) { sp[i] = R(-500, 500); sp[i + 1] = R(90, 300); sp[i + 2] = R(-500, 100); }
    const sg = new T.BufferGeometry(); sg.setAttribute("position", new T.BufferAttribute(sp, 3));
    g.add(new T.Points(sg, new T.PointsMaterial({color: 0xbfb6ff, size: 1.2, sizeAttenuation: true})));

    // ground, driveway, entrance path, light pools
    const ground = K.plane(g, 900, 900, K.std(0x07060c, {roughness: .55, metalness: .35}), 0, 0, 0); ground.rotation.x = -Math.PI / 2;
    const path = K.plane(g, 12, 26, K.std(0x15121c, {roughness: .3, metalness: .5}), 0, .01, 13); path.rotation.x = -Math.PI / 2;
    [-6, 6].forEach(x => { const l = K.box(g, .12, .03, 26, K.neon(0xffd23f, 1.8), x, .02, 13); });
    for (let z = 18; z < 60; z += 4) [-1, 1].forEach(s => K.box(g, .18, .02, 1.8, K.neon(0x1ee3ff, 1.1), s * 11, .02, z));
    const pool = (rgb, x, z, s, k) => { const p = K.plane(g, s, s, K.add(K.glowTex(rgb), k), x, .03, z); p.rotation.x = -Math.PI / 2; return p; };
    pool("255,190,90", 0, 6, 26, .3); pool("30,227,255", -17, 5, 22, .38); pool("255,46,136", 17, 5, 22, .38); pool("176,107,255", 0, 22, 40, .18);

    // building facade (opening for the doors), tower, side wings
    const glass = new T.MeshBasicMaterial({map: winTex(.26, ["#ffd88a", "#9fe6ff", "#d9b3ff"]), color: new T.Color(.42, .42, .52)});
    glass.map.wrapS = glass.map.wrapT = T.RepeatWrapping; glass.map.repeat.set(4, 2);
    const facade = new T.Group(); g.add(facade);
    K.box(facade, 33.5, 24, 1, glass, -21.25, 12, -.5); K.box(facade, 33.5, 24, 1, glass, 21.25, 12, -.5); K.box(facade, 9, 18.8, 1, glass, 0, 14.6, -.5);
    const sideMat = new T.MeshBasicMaterial({color: 0x05050a});
    K.box(g, 1, 24, 52, sideMat, -38, 12, -26); K.box(g, 1, 24, 52, sideMat, 38, 12, -26); K.box(g, 76, 1, 52, sideMat, 0, 24.2, -26);
    const tg = K.box(g, 28, 22, 6, glass, 0, 35, -4);
    // chrome + neon edges
    [[-38, 0x1ee3ff], [38, 0xb06bff], [-14, 0xffd23f], [14, 0xffd23f]].forEach(([x, c]) => K.box(g, .35, x === -14 || x === 14 ? 22 : 24, .35, K.neon(c, 2.6), x, x === -14 || x === 14 ? 35 : 12, .1));
    K.box(g, 76.6, .3, .3, K.neon(0xffd23f, 2.4), 0, 24.1, .1); K.box(g, 28.6, .3, .3, K.neon(0xff2e88, 2.6), 0, 46, -.9);
    K.box(g, 76.6, .25, .25, K.neon(0x1ee3ff, 2), 0, 5.6, .15);

    // KJ'S PICKS sign + subtitle (the building's name)
    const sign = K.ctex(2048, 512, (x, w, h) => { x.clearRect(0, 0, w, h);
      x.font = '400 400px "Bebas Neue", Impact, sans-serif'; x.textAlign = "center"; x.textBaseline = "middle";
      x.shadowColor = "#ff2e88"; x.shadowBlur = 50; x.fillStyle = "#ffe9f4"; x.fillText("KJ’S PICKS", w / 2, h / 2 + 20);
      x.shadowBlur = 0; x.lineWidth = 6; x.strokeStyle = "#ffd23f"; x.strokeText("KJ’S PICKS", w / 2, h / 2 + 20); });
    const sm = new T.MeshBasicMaterial({map: sign, transparent: true, color: new T.Color(1.6, 1.4, 1.5), depthWrite: false});
    K.plane(g, 26, 6.5, sm, 0, 37, -.9);
    K.plane(g, 34, 14, K.add(K.glowTex("255,46,136"), .35), 0, 37, -1.0);
    const sub = K.ctex(2048, 160, (x, w, h) => { x.font = '700 92px Orbitron, Consolas, monospace'; x.textAlign = "center"; x.textBaseline = "middle";
      x.shadowColor = "#1ee3ff"; x.shadowBlur = 24; x.fillStyle = "#bff6ff"; x.fillText("FOOTBALL MARKET INTELLIGENCE", w / 2, h / 2); });
    K.plane(g, 22, 1.7, new T.MeshBasicMaterial({map: sub, transparent: true, color: new T.Color(1.3, 1.3, 1.3), depthWrite: false}), 0, 31.2, -.9);

    // facade LED ribbon (the ticker, outside) + two tall LED walls (NCAA / NFL, real lines)
    const tickerTex = (lines, hgt, col) => { const t = K.ctex(4096, hgt, (x, w, h) => { x.fillStyle = "#020205"; x.fillRect(0, 0, w, h);
        x.font = `700 ${h * .5}px "JetBrains Mono", Consolas, monospace`; x.textBaseline = "middle"; let px = 20;
        (lines.length ? lines : ["KJ’S PICKS · MODEL LIVE"]).forEach((l, i) => { x.fillStyle = i % 3 === 0 ? col : i % 3 === 1 ? "#ffffff" : "#39ff88"; x.fillText(l + "   ★   ", px, h / 2); px += x.measureText(l + "   ★   ").width; });
        x.fillStyle = "rgba(0,0,0,.35)"; for (let yy = 0; yy < h; yy += 4) x.fillRect(0, yy, w, 1); });
      t.wrapS = T.RepeatWrapping; return t; };
    const rib = tickerTex(F.ticker, 128, "#ffd23f"); rib.repeat.set(.45, 1);
    K.plane(g, 70, 2.2, new T.MeshBasicMaterial({map: rib, color: new T.Color(1.5, 1.5, 1.5)}), 0, 21.8, .08);
    W.anim.push(dt => { rib.offset.x = (rib.offset.x + dt * .02) % 1; });
    const ledWall = (title, lines, col, x) => {
      const t = K.ctex(512, 2048, (c, w, h) => { c.fillStyle = "#04030a"; c.fillRect(0, 0, w, h);
        for (let blk = 0; blk < 2; blk++) { const y0 = blk * h / 2;
          c.fillStyle = col; c.font = '400 190px "Bebas Neue", Impact, sans-serif'; c.textAlign = "center"; c.fillText(title, w / 2, y0 + 210);
          c.strokeStyle = "rgba(255,255,255,.15)"; c.lineWidth = 3; for (let k = 0; k < 6; k++) { c.beginPath(); c.moveTo(40, y0 + 290 + k * 30); c.lineTo(w - 40, y0 + 290 + k * 30); c.stroke(); }
          c.textAlign = "left"; c.font = '600 30px "JetBrains Mono", Consolas, monospace';
          (lines.length ? lines : ["MODEL BOARD UPDATING"]).slice(0, 18).forEach((l, i) => { c.fillStyle = i % 2 ? "#ffffff" : col; c.fillText(String(l).slice(0, 28), 36, y0 + 520 + i * 46); }); }
        c.fillStyle = "rgba(0,0,0,.3)"; for (let yy = 0; yy < h; yy += 4) c.fillRect(0, yy, w, 1); });
      t.wrapT = T.RepeatWrapping; t.repeat.set(1, .5);
      K.plane(g, 11, 15, new T.MeshBasicMaterial({map: t, color: new T.Color(1.35, 1.35, 1.35)}), x, 12.5, .1);
      K.plane(g, 18, 22, K.add(K.glowTex(col === "#ffd23f" ? "255,210,63" : "30,227,255"), .22), x, 12.5, .05);
      W.anim.push(dt => { t.offset.y = (t.offset.y + dt * .012) % 1; });
    };
    ledWall("NCAA", F.ncaa, "#1ee3ff", -21); ledWall("NFL", F.nfl, "#ffd23f", 21);

    // entrance: canopy, pillars, gold door frame, sliding glass doors with the etched logo
    K.box(g, 22, .6, 9, K.std(0x0b0a12, {metalness: .8, roughness: .3}), 0, 6.3, 4.5);
    K.box(g, 22.2, .14, .14, K.neon(0xffd23f, 2), 0, 6.0, 9.05); [-11.05, 11.05].forEach(x => K.box(g, .14, .14, 9, K.neon(0xffd23f, 2), x, 6.0, 4.5));
    for (let i = -4; i <= 4; i++) { const d = new T.Mesh(new T.CircleGeometry(.22, 16), K.neon(0xfff1c8, 1.5)); d.rotation.x = Math.PI / 2; d.position.set(i * 2.2, 5.98, 5); g.add(d); }
    [-10, 10].forEach(x => { const c = new T.Mesh(new T.CylinderGeometry(.28, .28, 6, 16), K.std(0xc8ccd8, {metalness: 1, roughness: .2})); c.position.set(x, 3, 8.6); g.add(c); });
    K.box(g, 9.4, .2, .4, K.neon(0xffd23f, 1.5), 0, 5.3, .05); [-4.6, 4.6].forEach(x => K.box(g, .2, 5.3, .4, K.neon(0xffd23f, 1.5), x, 2.65, .05));
    const etch = K.ctex(512, 1024, (x, w, h) => { x.fillStyle = "rgba(140,190,255,.10)"; x.fillRect(0, 0, w, h);
      x.font = '400 150px "Bebas Neue", Impact, sans-serif'; x.textAlign = "center"; x.fillStyle = "rgba(255,215,120,.85)"; x.fillText("KJ", w / 2, h * .45);
      x.font = '700 34px Orbitron, Consolas, monospace'; x.fillText("SPORTSBOOK", w / 2, h * .52); x.strokeStyle = "rgba(255,215,120,.5)"; x.lineWidth = 6; x.strokeRect(10, 10, w - 20, h - 20); });
    const dm = new T.MeshBasicMaterial({map: etch, transparent: true, opacity: .9, depthWrite: false, side: T.DoubleSide});

  /* ------------------------------------------------------------------ camera path */
  function path(T, pitch) {
    const seat = new T.Vector3(0, 1.15, -30), fwd = new T.Vector3(0, Math.sin(pitch), -Math.cos(pitch));
    const K = [[0, [0, 1.7, 64], [0, 10, 0]], [.2, [0, 1.75, 46], [0, 9, 0]], [.4, [0, 1.7, 21], [0, 4.6, 0]], [.52, [0, 1.65, 7], [0, 2.6, -20]],
      [.63, [0, 1.65, -3], [0, 4, -48]], [.82, [0, 1.55, -18], [0, 4, -48]], [1, seat.toArray(), seat.clone().add(fwd.clone().multiplyScalar(18)).toArray()]];
    const pos = new T.CatmullRomCurve3(K.map(k => new T.Vector3(...k[1])), false, "centripetal");
    const look = new T.CatmullRomCurve3(K.map(k => new T.Vector3(...k[2])), false, "centripetal");
    const ps = K.map(k => k[0]);
    const u = p => { for (let i = 1; i < ps.length; i++) if (p <= ps[i]) return (i - 1 + (p - ps[i - 1]) / (ps[i] - ps[i - 1])) / (ps.length - 1); return 1; };
    return {seat, fwd, at: p => ({pos: pos.getPoint(u(p)), look: look.getPoint(u(p))})};
  }

  /* ------------------------------------------------------------------ the screen wall: 3D frames placed exactly behind the HTML panels */
  function buildWall(T, K, st) {
    if (st.wallGroup) { st.room.remove(st.wallGroup); st.wallGroup.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } }); }
    const grp = new T.Group(); st.room.add(grp); st.wallGroup = grp;
    const sr = st.stage.getBoundingClientRect(), cam = st.cam, d = st.D;
    const halfH = Math.tan(T.MathUtils.degToRad(cam.fov / 2)) * d, halfW = halfH * cam.aspect;
    const right = new T.Vector3(1, 0, 0), up = new T.Vector3(0, Math.cos(st.pitch), Math.sin(st.pitch)), center = st.P.seat.clone().add(st.P.fwd.clone().multiplyScalar(d));
    const toWorld = (px, py, dz = 0) => { const nx = (px / sr.width) * 2 - 1, ny = 1 - (py / sr.height) * 2;
      return center.clone().add(right.clone().multiplyScalar(nx * halfW)).add(up.clone().multiplyScalar(ny * halfH)).add(st.P.fwd.clone().multiplyScalar(dz)); };
    st.ppm = sr.height / (2 * halfH);                                // pixels per metre on the wall (for the seated parallax)
    const quat = new T.Quaternion().setFromRotationMatrix(new T.Matrix4().makeBasis(right, up, st.P.fwd.clone().negate()));
    const put = (m, cx, cy, dz) => { m.position.copy(toWorld(cx, cy, dz)); m.quaternion.copy(quat); grp.add(m); return m; };
    // physical backing wall + big logo above it
    put(new T.Mesh(new T.PlaneGeometry(halfW * 2 + 14, halfH * 2 + 6), new T.MeshStandardMaterial({color: 0x07050c, roughness: .8})), sr.width / 2, sr.height / 2, .35);
    const logo = K.ctex(1600, 260, (x, w, h) => { x.font = '400 220px "Bebas Neue", Impact, sans-serif'; x.textAlign = "center"; x.textBaseline = "middle";
      x.shadowColor = "#ffd23f"; x.shadowBlur = 30; x.fillStyle = "#fff4cf"; x.fillText("KJ’S PICKS SPORTSBOOK", w / 2, h / 2); });
    put(new T.Mesh(new T.PlaneGeometry(16, 2.6), new T.MeshBasicMaterial({map: logo, transparent: true, depthWrite: false, color: new T.Color(1.4, 1.3, 1.1)})), sr.width / 2, -sr.height * .09, .2);
    const COL = {official: "#ffd23f", gold: "#ffd23f", ncaa: "#1ee3ff", nfl: "#ffb020", ribbon: "#ff2e88", plain: "#b06bff"};
    st.wall.querySelectorAll("[data-frame]").forEach(el => {
      const r = el.getBoundingClientRect(); if (r.width < 4 || r.height < 4) return;
      const x0 = r.left - sr.left, y0 = r.top - sr.top, cx = x0 + r.width / 2, cy = y0 + r.height / 2;
      const w = r.width / st.ppm, h = r.height / st.ppm, kind = el.dataset.frame, col = COL[kind] || COL.plain, big = kind === "official";
      const pad = big ? .32 : .16;
      put(new T.Mesh(new T.PlaneGeometry(w + pad * 2, h + pad * 2), K.neon(col, big ? 3.2 : 1.7)), cx, cy, .08);           // lit frame
      put(new T.Mesh(new T.PlaneGeometry(w + .02, h + .02), new T.MeshBasicMaterial({color: 0x020106})), cx, cy, .06);   // bezel
      const tex = K.ctex(Math.min(1024, Math.round(r.width * 1.2)), Math.min(1024, Math.round(r.height * 1.2)), (x, cw, ch) => drawScreen(x, cw, ch, el.dataset.title || "", (el.dataset.lines || "").split("|").filter(Boolean), col));
      const scr = put(new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({map: tex, color: new T.Color(1.15, 1.15, 1.15)})), cx, cy, .04);
      scr.userData.href = el.dataset.href || ""; if (scr.userData.href) st.W.clickables.push(scr);
      if (big) { put(new T.Mesh(new T.PlaneGeometry(w * 2.2, h * 2), K.add(K.glowTex("255,210,63"), .55)), cx, cy, .1); st.offRect = {cx, cy}; }
    });
    // focused overhead light on the official board
    if (!st.spot) { st.spot = new T.SpotLight(0xffe2a0, 900, 60, .38, .6, 1.6); st.room.add(st.spot, st.spot.target); }
    st.spot.position.copy(center.clone().add(new T.Vector3(0, 9, 8)));
    st.spot.target.position.copy(st.offRect ? toWorld(st.offRect.cx, st.offRect.cy, 0) : center);
  }

  /* ------------------------------------------------------------------ mount / loop / unmount */
  async function mount(o) {
    unmount();

    try { await withTimeout(document.fonts.ready, 3000); } catch (e) {}
    const lib = await loadThree(full);
    const T = lib.T, K = kit(T);
    const st = S = {o, T, K, stage: o.stage, wall: o.wall, sec: o.sec, alive: true, pitch: T.MathUtils.degToRad(9), D: 18, p: 0, pv: 0, mx: 0, my: 0, vis: true, last: 0};
    const renderer = new T.WebGLRenderer({antialias: full, powerPreference: "high-performance", alpha: false});
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, full ? 1.5 : 1.25));
    renderer.outputColorSpace = T.SRGBColorSpace; renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
    o.host.appendChild(renderer.domElement); renderer.domElement.setAttribute("aria-hidden", "true");
    const scene = new T.Scene(), W = buildWorld(T, K, o.feeds, lite);
    scene.add(W.root); st.W = W; st.room = W.room;
    scene.background = W.sky; scene.fog = new T.Fog(0x0a0820, 70, 420);
    const cam = new T.PerspectiveCamera(o.fov || 52, 1, .1, 1500); st.cam = cam;
    st.P = path(T, st.pitch);
    let composer = null;
    if (full && lib.EffectComposer) {
      composer = new lib.EffectComposer(renderer); composer.addPass(new lib.RenderPass(scene, cam));
      st.bloom = new lib.UnrealBloomPass(new T.Vector2(256, 256), .6, .45, .9); composer.addPass(st.bloom); composer.addPass(new lib.OutputPass());
    }
    st.renderer = renderer; st.scene = scene; st.composer = composer;
    const ray = new T.Raycaster(), ndc = new T.Vector2();

    const resize = () => {
      const w = st.stage.clientWidth, h = st.stage.clientHeight; if (!w || !h) return;
      renderer.setSize(w, h, false); renderer.domElement.style.width = w + "px"; renderer.domElement.style.height = h + "px";
      cam.aspect = w / h; cam.fov = (o.fov || 52) * (w < h ? 1.18 : 1); cam.updateProjectionMatrix();
      if (composer) { composer.setSize(w, h); }
      W.clickables = W.clickables.filter(m => !st.wallGroup || !st.wallGroup.children.includes(m));
      buildWall(T, K, st); st.dirty = true;
    };
    const progress = () => { const r = st.sec.getBoundingClientRect(), span = st.sec.offsetHeight - innerHeight; return span > 0 ? clamp(-r.top / span, 0, 1) : 1; };
    const onScroll = () => { st.p = progress(); st.dirty = true; };
    const onMove = e => { if (!full) return; st.mx = (e.clientX / innerWidth - .5); st.my = (e.clientY / innerHeight - .5); st.dirty = true; };
    const onClick = e => {
      if (st.pv < .9) return;
      const r = renderer.domElement.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, cam); const hit = ray.intersectObjects(W.clickables, false)[0];
      if (hit && hit.object.userData.href && o.go) o.go(hit.object.userData.href);

    io.observe(st.stage);
    addEventListener("resize", resize); addEventListener("scroll", onScroll, {passive: true}); addEventListener("pointermove", onMove, {passive: true});

    const tmpPos = new T.Vector3(), tmpLook = new T.Vector3();

      st.pv += (st.p - st.pv) * (o.reduced ? 1 : 1 - Math.pow(.0009, dt));       // eased follow of the scroll position
      const p = st.pv, cp = st.P.at(p);
      tmpPos.copy(cp.pos); tmpLook.copy(cp.look);
      const seat = smooth(.94, 1, p);
      if (seat > 0 && full) { tmpPos.x += st.mx * .1 * seat; tmpPos.y -= st.my * .05 * seat; tmpLook.x += st.mx * .1 * seat; tmpLook.y -= st.my * .05 * seat; }
      cam.position.copy(tmpPos); cam.lookAt(tmpLook);
      if (o.onShift) o.onShift(-st.mx * .1 * seat * (st.ppm || 0) * (full ? 1 : 0), st.my * .05 * seat * (st.ppm || 0) * (full ? 1 : 0));

      const dO = smooth(.4, .5, p); W.doors.forEach(d => { d.position.x = d.userData.home + (d.userData.open - d.userData.home) * dO; });
      const k = smooth(.5, .66, p);

      W.ext.forEach(l => { if (l.isLight) l.intensity = l.userData.base * (1 - k); }); W.int.forEach(l => { l.intensity = l.userData.base * (.15 + .85 * k); });

    }
    function kick() { if (!st.raf && st.alive) { clearTimeout(st.idle); st.raf = requestAnimationFrame(frame); } }

function lineChart(series, opts = {}) {
  const W = opts.w || 640, H = opts.h || 180, P = 28;
  const pts = series.flatMap(s => s.data.filter(d => d.y != null));
  if (pts.length < 2) return '<div class="empty small">Not enough history yet - this chart fills in as the model updates.</div>';
  let ys = pts.map(d => d.y); (opts.refs || []).forEach(r => r.y != null && ys.push(r.y));
  let lo = Math.min(...ys), hi = Math.max(...ys); if (hi - lo < 2) { lo -= 1; hi += 1; }
  const xs = pts.map(d => d.x), x0 = Math.min(...xs), x1 = Math.max(...xs) === x0 ? x0 + 1 : Math.max(...xs);
  const X = x => P + (x - x0) / (x1 - x0) * (W - 2 * P), Y = y => H - P - (y - lo) / (hi - lo) * (H - 2 * P);
  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">`;
  for (let k = 0; k <= 3; k++) { const y = lo + (hi - lo) * k / 3; s += `<line x1="${P}" x2="${W - P}" y1="${Y(y)}" y2="${Y(y)}" stroke="#2c1c4d" stroke-dasharray="3 4"/><text x="2" y="${Y(y) + 3}">${y.toFixed(1)}</text>`; }
  (opts.refs || []).forEach(r => { if (r.y != null) s += `<line x1="${P}" x2="${W - P}" y1="${Y(r.y)}" y2="${Y(r.y)}" stroke="${r.c}" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W - P - 4}" y="${Y(r.y) - 4}" text-anchor="end" style="fill:${r.c}">${esc(r.label)}</text>`; });
  series.forEach(se => { const d = se.data.filter(p => p.y != null); if (!d.length) return;
    const pl = d.map(p => X(p.x) + "," + Y(p.y)).join(" ");
    s += `<polyline points="${pl}" fill="none" stroke="rgba(0,0,0,.6)" stroke-width="4" transform="translate(2 5)" class="lc-shadow"/><polyline points="${pl}" fill="none" stroke="${se.c}" stroke-width="2.4" style="filter:drop-shadow(0 0 4px ${se.c})"/>`;
    d.forEach(p => s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3.4" fill="#0b0716" stroke="${se.c}" stroke-width="2"><title>${esc(p.t || "")}: ${p.y}</title></circle>`);
    if (se.label) s += `<text x="${X(d[d.length - 1].x) - 4}" y="${Y(d[d.length - 1].y) - 6}" text-anchor="end" style="fill:${se.c}">${esc(se.label)}</text>`; });
  if (opts.xlab) opts.xlab.forEach(l => s += `<text x="${X(l.x)}" y="${H - 6}" text-anchor="middle">${esc(l.t)}</text>`);
  return s + "</svg>";
}
function bars(items, opts = {}) { const max = Math.max(...items.map(i => Math.abs(i.v)), 1e-9);
  return items.map(i => `<div class="hbar"><span class="small">${esc(i.k)}</span><div class="track"><i style="left:0;width:${Math.abs(i.v) / max * 100}%;background:${i.c || "var(--purple)"}"></i></div><span class="mono small">${esc(i.lab != null ? i.lab : num(i.v, 2))}</span></div>`).join(""); }
function divBar(label, v, max, favor) { const w = Math.min(Math.abs(v) / max, 1) * 50;
  return `<div class="hbar"><span class="small">${esc(label)}</span><div class="track"><span class="mid"></span><i style="${v >= 0 ? `left:50%;width:${w}%` : `left:${50 - w}%;width:${w}%`};background:${v >= 0 ? "var(--green)" : "var(--red)"};box-shadow:0 0 8px ${v >= 0 ? "var(--green)" : "var(--red)"}"></i></div><span class="mono small ${v >= 0 ? "g" : "r"}">${esc(favor || "")} ${sgn(Math.abs(v))}</span></div>`; }

const hexRgb = h => { const m = /^#?([0-9a-f]{6})$/i.exec(h || ""); if (!m) return null; const n = parseInt(m[1], 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
function glowRgb(hex, fb) {                 // team color usable as light: very dark colors are brightened, never replaced by guesses
  let c = hexRgb(hex); if (!c) return fb;
  const mx = Math.max(...c); if (mx < 150) { const k = mx ? 170 / mx : 1; c = c.map(v => Math.min(255, Math.round(v * k + (mx ? 0 : 120)))); }
  return c.join(",");
}
const NFL_COLORS = {ARI: "#97233F", ATL: "#A71930", BAL: "#241773", BUF: "#00338D", CAR: "#0085CA", CHI: "#C83803", CIN: "#FB4F14", CLE: "#FF3C00", DAL: "#003594",
  DEN: "#FB4F14", DET: "#0076B6", GB: "#FFB612", HOU: "#A71930", IND: "#002C5F", JAX: "#006778", KC: "#E31837", LV: "#A5ACAF", LAC: "#0080C6", LA: "#003594", LAR: "#003594",

  TEN: "#4B92DB", WAS: "#FFB612"};
function teamRgb(t, fb) {
  if (!t) return fb;
  if (t.color && !/^#?(000000|ffffff)$/i.test(t.color)) return glowRgb(t.color, fb);
  if (t.alt && !/^#?(000000|ffffff)$/i.test(t.alt)) return glowRgb(t.alt, fb);
  return NFL_COLORS[t.abbr] ? glowRgb(NFL_COLORS[t.abbr], fb) : fb;
}
const teamEmblem = (t, size = "lg", rgb) => `<span class="emb ${size}" style="--tc:${rgb || teamRgb(t, "176,107,255")}">${logo(t, size)}</span>`;
const mt = (k, v, cls = "", note = "") => `<div class="mt"><div class="k">${k}</div><div class="v ${cls}">${v}</div>${note ? `<div class="n">${note}</div>` : ""}</div>`;
function qeBet(r) {                          // the quant engine's current numbers for this exact bet (used only when the release snapshot lacks them)
  const L = ((D.qe || {}).leagues || {})[r.league], g = L && L.games && L.games[String(r.game_id)];
  return g ? (g.bets || []).find(b => b.label === r.pick) || null : null;
}
function pickTeams(r) {
  const g = r.league === "NCAA" ? G[String(r.game_id)] : null, nf = r.league === "NFL" ? NFLG.find(x => x.id === r.game_id) : null;
  const H = g ? g.home : nf ? nf.home : null, A = g ? g.away : nf ? nf.away : null;
  let P = null;
  if (r.bet_type !== "Total" && r.team && H) P = g ? (r.team === g.home_name ? H : r.team === g.away_name ? A : [H, A].find(t => r.team.startsWith(t.school)))
    : [H, A].find(t => t.school === r.team);
  return {g, nf, H, A, P: P || null};
}

    <div class="tp-conf">${confRing(r.confidence, 92)}<div class="tiny tech muted">CONFIDENCE</div></div></div>
   <div class="tp-grid">
    ${mt(isP ? "MODEL PROJECTION" : "KJ’S PICKS FAIR LINE", isP || isT ? num(isP ? (r.proj ?? r.fair_line) : r.fair_line) : fl(r.fair_line), "b")}
    ${mt("MARKET LINE", lv(r.market_line), "w", "at release")}
    ${mt("EDGE", r.edge == null ? "–" : sgn(r.edge) + (isP ? "" : " pts"), "g")}
    ${mt("EV", spct(r.ev), clsv(r.ev))}
    ${mt("SIM PROBABILITY", pick(r.sim_prob, q && q.p_raw, v => pct(v)))}

   ${o.winHome != null ? advMeter(o.away, o.home, o.winHome, ra, rh) : ""}`;

function advMeter(a, h, pH, ra, rh) {         // model win probability as a floating depth meter (numbers always shown as text)
  const fav = pH >= .5 ? "h" : "a", w = Math.min(Math.abs(pH - .5) * 2, 1) * 50;
  const nm = t => esc(abbr(t));
  return `<div class="advm" style="--ca:${ra};--ch:${rh}" role="img" aria-label="Model win probability: ${nm(a)} ${pct(1 - pH, 0)}, ${nm(h)} ${pct(pH, 0)}">
    <div class="advm-lab"><span><b>${nm(a)}</b> ${pct(1 - pH, 0)}</span><span class="tech tiny muted">MODEL WIN PROBABILITY</span><span>${pct(pH, 0)} <b>${nm(h)}</b></span></div>
    <div class="advm-track"><span class="advm-mid"></span><i class="advm-fill ${fav}" style="${fav === "h" ? `left:50%;width:${w}%` : `left:${50 - w}%;width:${w}%`}"></i></div></div>`;
}

/* ---- HMM regime nodes: SLUMP / NORMAL / BREAKOUT with probabilities; the current state is lit and steps forward ---- */
function regimeNodes(probs, cur, opts = {}) {
  if (!probs || !cur) return `<div class="small muted">${esc(opts.unit || "")}: no regime yet</div>`;
  const def = !!opts.def;
  const order = def ? [["BREAKOUT", "SLIPPING", "cold"], ["NORMAL", "NORMAL", "norm"], ["SLUMP", "IMPROVING", "hot"]]
    : [["SLUMP", "SLUMP", "cold"], ["NORMAL", "NORMAL", "norm"], ["BREAKOUT", "BREAKOUT", "hot"]];
  const lab = k => (order.find(o => o[0] === k) || [k, k])[1];
  const moved = opts.prev && opts.prev !== cur;
  return `<div class="rn" role="group" aria-label="${esc(opts.unit || "")} hidden state: ${esc(lab(cur))} ${Math.round(probs[cur] * 100)}%">
    <div class="rn-h"><b>${esc(opts.unit || "")}</b>${moved ? ` <span class="rn-tr">${esc(lab(opts.prev))} → ${esc(lab(cur))}</span>` : ""}</div>
    <div class="rn-row">${order.map(([k, l, c]) => `<div class="rn-node ${c} ${k === cur ? "on" : ""} ${moved && k === opts.prev ? "was" : ""}"><i aria-hidden="true"></i><span class="l">${l}</span><span class="p">${pct(probs[k], 0)}</span>${k === cur ? '<span class="cur">CURRENT</span>' : ""}</div>`).join('<span class="rn-link" aria-hidden="true"></span>')}</div></div>`;
}
function teamRegimes(t, compact) {
  const tt = T[t.school]; if (!tt) return "";
  const seq = (u, d) => tt.games.filter(x => x[u] != null).map(x => regime3(x[u], x[d]));
  const so = seq("off_up", "off_down"), sd = seq("def_up", "def_down");
  return `<div class="rn-team ${compact ? "compact" : ""}">${compact ? `<div class="rn-tn">${logo(t)} <b>${esc(t.school)}</b></div>` : ""}
    ${regimeNodes(tt.off_probs, tt.off_regime, {unit: "OFFENSE", prev: so[so.length - 2]})}${regimeNodes(tt.def_probs, tt.def_regime, {unit: "DEFENSE", def: true, prev: sd[sd.length - 2]})}</div>`;
}

/* ---- Kalman true strength: floating chart with an uncertainty band and an elevation shadow ---- */
function strengthChart(t) {
  const all = (t.games || []).filter(x => x.kal != null), nx = all.findIndex(x => !x.done);
  const gs = nx < 0 ? all : all.slice(0, nx + 1);                // played games + the next one (unplayed games repeat the current estimate)
  if (gs.length < 2) return '<div class="empty small">Not enough games yet.</div>';
  const W = 640, H = 210, P = 30, rgb = teamRgb(t, "176,107,255");
  const ys = gs.flatMap(x => [x.kal + (x.kal_sd || 0), x.kal - (x.kal_sd || 0)]);
  let lo = Math.min(...ys), hi = Math.max(...ys); if (hi - lo < 4) { lo -= 2; hi += 2; }
  const X = i => P + i / (gs.length - 1) * (W - 2 * P), Y = v => H - P - (v - lo) / (hi - lo) * (H - 2 * P);
  const pts = gs.map((x, i) => `${X(i).toFixed(1)},${Y(x.kal).toFixed(1)}`).join(" ");
  const band = gs.map((x, i) => `${X(i).toFixed(1)},${Y(x.kal + (x.kal_sd || 0)).toFixed(1)}`).concat(gs.slice().reverse().map((x, j) => `${X(gs.length - 1 - j).toFixed(1)},${Y(x.kal - (x.kal_sd || 0)).toFixed(1)}`)).join(" ");
  const id = "sg" + Math.random().toString(36).slice(2, 7);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="strc-svg" role="img" aria-label="${esc(t.school)} true strength by game, now ${num(t.kal)}">
   <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgb(${rgb})" stop-opacity=".35"/><stop offset="1" stop-color="rgb(${rgb})" stop-opacity="0"/></linearGradient></defs>`;
  if (lo < 0 && hi > 0) s += `<line x1="${P}" x2="${W - P}" y1="${Y(0)}" y2="${Y(0)}" stroke="rgba(255,255,255,.25)" stroke-dasharray="4 5"/><text x="${W - P}" y="${Y(0) - 4}" text-anchor="end">avg FBS</text>`;
  s += `<polygon points="${band}" fill="rgba(${rgb},.12)"/>
   <polygon points="${X(0)},${H - P} ${pts} ${X(gs.length - 1)},${H - P}" fill="url(#${id})"/>
   <polyline points="${pts}" fill="none" stroke="rgba(0,0,0,.65)" stroke-width="4" transform="translate(3 6)" style="filter:blur(2px)"/>
   <polyline points="${pts}" fill="none" stroke="rgb(${rgb})" stroke-width="2.6" style="filter:drop-shadow(0 0 5px rgb(${rgb}))"/>`;
  gs.forEach((x, i) => { s += `<circle cx="${X(i)}" cy="${Y(x.kal)}" r="${i === gs.length - 1 ? 5.5 : 3.5}" fill="#0b0716" stroke="rgb(${rgb})" stroke-width="2"><title>${esc((x.home ? "vs " : "@ ") + x.opp)}: ${num(x.kal)} ± ${num(x.kal_sd)}</title></circle>`;
    s += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle">${esc((x.home ? "" : "@") + (T[x.opp] ? T[x.opp].abbr || x.opp.slice(0, 4) : x.opp.slice(0, 4)))}</text>`; });
  const tr = t.kal_trend;
  return `<div class="strc" style="--tc:${rgb}"><div class="strc-head"><div><div class="tech tiny muted">KJ’S PICKS TRUE STRENGTH (KALMAN)</div>
     <div class="strc-v">${num(t.kal)} <span class="${tr > 0 ? "g" : tr < 0 ? "r" : "d"}">${tr == null ? "" : tr > 0 ? "▲ +" + tr.toFixed(1) : tr < 0 ? "▼ " + tr.toFixed(1) : "■ STEADY"}</span></div></div>
     <div class="tiny muted" style="max-width:260px">Points better than an average FBS team, estimated before each game. Band = model uncertainty (±1σ).</div></div>${s}</svg></div>`;
}

/* ---- sportsbook odds wall (front-facing rows; values that moved since your last visit step forward with a glow) ---- */

  LS.set("wall", next);
  return `<div class="wall"><div class="wall-h"><span>KJ’S PICKS BOARD</span><span class="tiny">SPREAD = HOME TEAM · ★ OFFICIAL PLAY · LIVE SCORES WHEN GAMES START</span></div>
   <div class="tw"><table class="wall-t"><thead><tr><th>LG</th><th>MATCHUP</th><th>SPREAD</th><th>TOTAL</th><th>KJ FAIR</th><th>EDGE</th><th>CONF</th><th>STATUS</th><th>KICKOFF / SCORE</th></tr></thead><tbody>
   ${rows.map(r => `<tr ${r.attr} tabindex="0" class="${r.st === "official" ? "off" : ""}"><td>${lgBadge(r.lg)}</td>

     <td class="mono small" data-wall="${esc(r.ev || "")}">${new Date(r.ko) <= now ? '<span class="g">● LIVE</span>' : esc(fmtTime(r.ko))}</td></tr>`).join("")}</tbody></table></div></div>`;
}
async function fillWall() {                  // live scores only when a listed game is actually under way

}

/* ---------- SIMULATION ---------- */
function simulate(sim, ctx, N = 10000) {

    const m = sm(); let t = st(), tries = 0;
    while ((t < Math.abs(m) || (t + m) % 2 !== 0) && tries++ < 200) t = st();
    if (t < Math.abs(m)) t = Math.abs(m); if ((t + m) % 2 !== 0) t += 1; const h = (t + m) / 2, a = (t - m) / 2; hs.push(h); as.push(a);

  for (let m = lo; m <= hi; m++) { const c = hist[m] || 0, x = P + (m - lo) / (hi - lo) * (W - 2 * P), bh = c / maxc * (H - 2 * P);
    const isKey = [3, 7, 10, 14, 17, 21].includes(Math.abs(m)); svg += `<rect x="${x - 3}" y="${H - P - bh}" width="6" height="${bh}" fill="${m > 0 ? "#1ee3ff" : "#ff2e88"}" opacity="${isKey ? 1 : .6}"><title>${m > 0 ? "Home by " + m : m < 0 ? "Away by " + (-m) : "tie"}: ${(c / N * 100).toFixed(1)}%</title></rect>`; }

  svg += `<line x1="${X(sim.mu_m)}" x2="${X(sim.mu_m)}" y1="${P / 2}" y2="${H - P}" stroke="#39ff88" stroke-width="2" stroke-dasharray="5 3"/><text x="${X(sim.mu_m) + 4}" y="${P + 14}" style="fill:#39ff88">MODEL</text>`;
  svg += `<text x="${P}" y="${H - 6}">${esc(abbr(ctx.away))} by 45</text><text x="${W / 2}" y="${H - 6}" text-anchor="middle">tie</text><text x="${W - P}" y="${H - 6}" text-anchor="end">${esc(abbr(ctx.home))} by 45</text></svg>`;

   <div class="kv">${[["WIN " + abbr(ctx.home), pct(win / N)], ["WIN " + abbr(ctx.away), pct(1 - win / N)],
     ...(ctx.spread != null ? [[abbr(ctx.home) + " COVERS " + line(ctx.spread), pct(cover / (N - push || 1))]] : []),
     ...(ctx.total != null ? [["OVER " + ctx.total, pct(over / N)], ["UNDER " + ctx.total, pct(1 - over / N)]] : []),
     ["AVG SCORE", `${avg(hs).toFixed(1)}-${avg(as).toFixed(1)}`], ["MEDIAN SCORE", `${med(hs)}-${med(as)}`], ...(fav ? [["UPSET", pct(upset / N)]] : [])]
     .map(([k, v]) => `<div><div class="k">${esc(k)}</div><div class="v w">${esc(v)}</div></div>`).join("")}</div>
   <div style="margin-top:10px">${svg}</div><div class="tiny muted">Margin distribution (home perspective). Brighter bars = key numbers (3, 7, 10, 14, 17, 21), weighted from real college results. Totals are drawn conditional on each simulated margin (a blowout needs points), so simulated O/U can differ slightly from the stand-alone total.</div>

    return {type: ml ? "ml" : "spread", teamId: teamIdFromName(team), team, line: ml ? null : nnum(label.split(" ").pop())};
  }

  const isHome = label.startsWith(g.home_name) || label.startsWith(g.home.school);

  return {type: / ML$/.test(label) ? "ml" : "spread", teamId: String((T[team.school] || {}).id || ""), team: team.school, line: bb && bb.point != null ? bb.point : nnum(label.split(" ").pop())};
}
function betStatus(e, gs) {
  if (!gs) return {k: "pending", t: "PENDING", note: ""};
  if (gs.state === "pre") return {k: "pending", t: "NOT STARTED", note: fmtTime(gs.start)};
  const fin = gs.state === "post";
  if (e.type === "prop") {
    const pl = gs.players[normName(e.player)], v = pl ? pl[e.stat] : null, unit = (PROP_UNIT[e.stat] || "");
    if (v == null) return fin ? {k: "void", t: "NO STAT", note: "no stat recorded"} : {k: "live", t: "LIVE", note: `Current: 0 ${unit} · ${e.side === "over" ? "needs " + needOver(e.line, 0) : "can allow " + allowUnder(e.line, 0)} more`};
    if (e.side === "over") { if (v > e.line) return {k: "won", t: "WON", note: `${v} ${unit} - cleared ${e.line}`};
      if (fin) return v === e.line ? {k: "push", t: "PUSH", note: `${v} ${unit}`} : {k: "lost", t: "LOST", note: `${v} ${unit}`};
      return {k: "live", t: "LIVE", note: `Current: ${v} ${unit} · needs ${needOver(e.line, v)} more`}; }
    if (v > e.line) return {k: "lost", t: "LOST", note: `${v} ${unit} - went over ${e.line}`};
    if (fin) return v === e.line ? {k: "push", t: "PUSH", note: `${v} ${unit}`} : {k: "won", t: "WON", note: `${v} ${unit}`};
    return {k: "live", t: "LIVE", note: `Current: ${v} ${unit} · can allow ${allowUnder(e.line, v)} more`};
  }
  let x;
  if (e.type === "total") x = (gs.home.score + gs.away.score - e.line) * (e.side === "over" ? 1 : -1);
  else { const mine = (e.homeSide ? e.homeSide === "home" : gs.home.id === e.teamId) ? gs.home : gs.away, oth = mine === gs.home ? gs.away : gs.home;
    x = mine.score - oth.score + (e.type === "spread" ? +e.line : 0); }
  if (fin) return x > 0 ? {k: "won", t: "WON", note: ""} : x < 0 ? {k: "lost", t: "LOST", note: ""} : {k: "push", t: "PUSH", note: ""};
  return x > 0 ? {k: "winning", t: "WINNING", note: ""} : x < 0 ? {k: "losing", t: "LOSING", note: ""} : {k: "pushing", t: "PUSHING", note: ""};
}
const PROP_UNIT = {pass_yds: "yds", rush_yds: "yds", rec_yds: "yds", receptions: "rec"};
const needOver = (ln, v) => { const n = Math.floor(ln) + 1 - v; return Math.max(n, 0); };
const allowUnder = (ln, v) => { const n = Math.ceil(ln) - 1 - v; return Math.max(n, 0); };
const stChip = s => `<span class="st ${s.k}">${s.k === "won" ? "✅ " : s.k === "lost" ? "❌ " : s.k === "winning" ? "🟢 " : s.k === "losing" ? "🟠 " : s.k === "live" ? "🟡 " : s.k === "pending" ? "⏳ " : ""}${esc(s.t)}</span>`;

async function refreshCard() {

}

}

function modelVerdict(x) {

  const lr = OFF.find(r => String(r.game_id) === String(x.gid) && (r.pick === x.label || (x.type === "prop" && r.player === x.player && r.stat === x.stat && r.side === x.side)));
  if (lr) return {official: true, ev: lr.ev, thr: D.meta.min_ev, why: ""};
  if (x.live) return {official: !!x.official, ev: x.ev, thr: 0.08, why: x.offWhy || ""};
  if (x.type === "prop") {
    const P = D.player_props || {}, all = [...(P.qualifying || []), ...(P.leans || []), ...(P.near || [])];
    const pp = all.find(y => y.gid === x.gid && propLabel(y) === x.label);
    const off = (P.qualifying || []).some(y => y.gid === x.gid && propLabel(y) === x.label);
    return {official: off || !!x.official, ev: pp ? pp.ev : x.ev, thr: (P.rules || {}).min_ev ?? 0.05, why: pp && pp.fail.length ? pp.fail[0] : (pp ? "" : "not in today's model pricing")};

  if (led && noteShown(led) && !isLiveOfficial(led)) return {official: false, invalid: true, ev: b ? b.ev : x.ev, thr: D.meta.min_ev, why: led.now_note};
  const off = (b && b.status === "official") || (led && isLiveOfficial(led)) || (!!x.official && !(b && b.status !== "official"));
  const PRI = ["Bet type enabled", "Injuries", "Model stability & risk flags", "Model vs market sanity", "Expected value", "Edge vs line", "Win probability"];
  const failed = (b && b.checks ? b.checks.filter(c => c.required && !c.ok) : []).sort((p, q) => ((PRI.indexOf(p.name) + 1) || 99) - ((PRI.indexOf(q.name) + 1) || 99));
  return {official: off, ev: b ? b.ev : x.ev, thr: D.meta.min_ev, why: failed.length ? `${failed[0].name}: ${failed[0].value}` : (b && b.why_not && b.why_not[0]) || (led && led.now_note) || ""};
}

function ledgerMeta(b) {
