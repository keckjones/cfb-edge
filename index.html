<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#06030d">
<title>KJ’s Picks</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06030d;--panel:#0f0a1c;--panel2:#160e29;--edge:#2c1c4d;--edge2:#3e2a68;--ink:#f5f1ff;--dim:#a99cc7;--dim2:#7b6f98;
  --green:#39ff88;--red:#ff4566;--gold:#ffd23f;--blue:#1ee3ff;--purple:#b06bff;--orange:#ff9f2e;--pink:#ff2e88;--white:#ffffff;
  --g-glow:0 0 10px rgba(57,255,136,.55);--r-glow:0 0 10px rgba(255,69,102,.55);--y-glow:0 0 12px rgba(255,210,63,.6);
  --b-glow:0 0 10px rgba(30,227,255,.55);--p-glow:0 0 12px rgba(176,107,255,.6);
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;--disp:"Bebas Neue",Impact,sans-serif;--tech:Orbitron,var(--mono);
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:14.5px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);
  background-image:radial-gradient(1100px 520px at 0% -5%,rgba(176,107,255,.20),transparent 60%),radial-gradient(900px 480px at 100% 0%,rgba(255,46,136,.16),transparent 60%),
  radial-gradient(1000px 700px at 50% 120%,rgba(30,227,255,.10),transparent 60%),
  linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:auto,auto,auto,32px 32px,32px 32px;background-attachment:fixed;padding-bottom:76px}
a{color:var(--blue);text-decoration:none}button{font:inherit;color:inherit}
.mono{font-family:var(--mono)}.tech{font-family:var(--tech)}
.g{color:var(--green)}.r{color:var(--red)}.y{color:var(--gold)}.b{color:var(--blue)}.p{color:var(--purple)}.o{color:var(--orange)}.w{color:#fff}.d{color:var(--dim)}
/* ticker */
.ticker{position:sticky;top:0;z-index:50;display:flex;height:36px;background:#000;border-bottom:2px solid var(--gold);box-shadow:0 2px 20px rgba(255,210,63,.3);
  font-family:var(--mono);font-size:12.5px;overflow:hidden}
.tk-l{flex:none;display:flex;align-items:center;gap:7px;padding:0 12px;background:linear-gradient(90deg,var(--pink),#b5106a);color:#fff;font:900 11px var(--tech);letter-spacing:.12em}
.dot{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:pulse 1.2s infinite}
.tk-w{flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 2%,#000 98%,transparent);mask-image:linear-gradient(90deg,transparent,#000 2%,#000 98%,transparent)}
.tk-t{display:inline-flex;height:100%;align-items:center;white-space:nowrap;animation:scroll var(--dur,160s) linear infinite}
.ticker:hover .tk-t{animation-play-state:paused}
.tk{display:inline-flex;align-items:center;gap:8px;padding:0 18px;height:100%;border-right:1px solid #222;cursor:pointer}
.tk .k{font-weight:700}
@keyframes scroll{to{transform:translateX(-50%)}}@keyframes pulse{50%{opacity:.25}}
/* header */
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin:18px 0 10px}
.brand h1{margin:0;font:400 clamp(46px,8vw,84px)/.9 var(--disp);letter-spacing:.05em;color:#fff;
  text-shadow:0 0 3px #fff,0 0 14px var(--pink),0 0 32px var(--pink),0 0 60px rgba(255,46,136,.6)}
.brand .sub{font:700 clamp(10px,2.2vw,13px) var(--tech);letter-spacing:.32em;color:var(--blue);text-shadow:var(--b-glow);margin-top:6px}
.status{background:#000;border:1px solid var(--edge2);border-radius:12px;padding:10px 14px;font-family:var(--mono);font-size:12px;min-width:260px;box-shadow:inset 0 0 20px rgba(176,107,255,.18)}
.status .live{display:flex;align-items:center;gap:8px;color:var(--green);font:900 12px var(--tech);letter-spacing:.2em;text-shadow:var(--g-glow)}
.status .live .dot{background:var(--green);box-shadow:0 0 8px var(--green)}
.status .row{display:flex;justify-content:space-between;gap:14px;color:var(--dim)}.status .row b{color:#fff;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:12px 0 4px}
.stat{background:#000;border:1px solid var(--edge2);border-radius:12px;padding:10px 12px;position:relative;overflow:hidden}
.stat .v{font:800 26px var(--tech);color:var(--gold);text-shadow:var(--y-glow);line-height:1.1}
.stat .k{font:700 10px var(--tech);letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-top:4px}
.stat.g .v{color:var(--green);text-shadow:var(--g-glow)}.stat.r .v{color:var(--red);text-shadow:var(--r-glow)}.stat.b .v{color:var(--blue);text-shadow:var(--b-glow)}
/* nav */
.tabs{position:sticky;top:36px;z-index:40;display:flex;gap:6px;padding:10px 0;margin-top:6px;background:linear-gradient(180deg,rgba(6,3,13,.98),rgba(6,3,13,.9));
  backdrop-filter:blur(8px);border-bottom:1px solid var(--edge);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--edge2);background:var(--panel);font:700 12px var(--tech);letter-spacing:.08em;cursor:pointer;color:var(--ink);white-space:nowrap}
.tab:hover{border-color:var(--blue);box-shadow:var(--b-glow)}.tab.on{background:var(--pink);border-color:var(--pink);box-shadow:0 0 14px rgba(255,46,136,.6);color:#fff}
.tab.gold{border-color:var(--gold);color:var(--gold);text-shadow:0 0 8px rgba(255,210,63,.5)}.tab.gold.on{background:var(--gold);border-color:var(--gold);color:#000;box-shadow:var(--y-glow);text-shadow:none}
.bnav button.gold{color:var(--gold)}.bnav button.gold.on{color:#fff;text-shadow:var(--y-glow)}
.tab.gd{border-color:var(--green);color:var(--green)}.tab.gd.on{background:var(--green);color:#000;box-shadow:var(--g-glow)}
.badge-n{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--gold);color:#000;font-size:11px;text-align:center}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;grid-template-columns:repeat(5,1fr);background:rgba(0,0,0,.94);border-top:2px solid var(--pink);
  padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px)}
.bnav button{background:none;border:0;padding:9px 0 8px;font:700 10px var(--tech);letter-spacing:.08em;color:var(--dim)}
.bnav button i{display:block;font-style:normal;font-size:18px;line-height:1.1}
.bnav button.on{color:var(--pink);text-shadow:0 0 8px rgba(255,46,136,.7)}
/* sections */
h2.sec{margin:26px 0 10px;font:400 30px/1 var(--disp);letter-spacing:.06em;color:var(--gold);text-shadow:var(--y-glow);display:flex;align-items:center;gap:10px}
h2.sec small{font:600 12px Inter;letter-spacing:0;color:var(--dim);text-shadow:none}
h3{font:700 13px var(--tech);letter-spacing:.12em;color:var(--blue);margin:18px 0 8px;text-transform:uppercase}
.panel{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--edge2);border-radius:14px;padding:14px 16px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.auto{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.muted{color:var(--dim)}.small{font-size:12.5px}.tiny{font-size:11px}
.disclaimer{font-size:12px;color:var(--orange);margin-top:8px}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font:700 11px Inter;border:1px solid var(--edge2);background:#120b22;color:#e7defa;margin:2px 4px 2px 0;white-space:nowrap}
.chip.official{color:#000;background:var(--gold);border-color:var(--gold);box-shadow:var(--y-glow)}
.chip.strong{color:var(--green);border-color:var(--green);background:rgba(57,255,136,.08)}
.chip.lean{color:var(--blue);border-color:rgba(30,227,255,.6);background:rgba(30,227,255,.06)}
.chip.none{color:var(--dim)}
.chip.hot{color:var(--orange);border-color:var(--orange)}.chip.cold{color:var(--blue);border-color:var(--blue)}.chip.hmm{color:var(--purple);border-color:var(--purple);background:rgba(176,107,255,.1)}
.chip.warn{color:var(--orange);border-color:var(--orange);background:rgba(255,159,46,.08)}.chip.bad{color:var(--red);border-color:var(--red);background:rgba(255,69,102,.08)}
.chip.good{color:var(--green);border-color:var(--green);background:rgba(57,255,136,.08)}
/* game cards */
.gc{position:relative;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--edge2);border-radius:14px;padding:12px 14px;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s}
.gc:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:var(--b-glow)}
.gc.official{border:2px solid var(--gold);box-shadow:0 0 18px rgba(255,210,63,.35)}
.gc .top{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.teamrow{display:flex;align-items:center;gap:9px;margin:6px 0}
.logo{width:30px;height:30px;object-fit:contain;flex:none;filter:drop-shadow(0 0 4px rgba(255,255,255,.15))}
.logo.lg{width:64px;height:64px}.logo.xl{width:90px;height:90px}
.tname{font-weight:800;font-size:15px;line-height:1.15}.tname .rk{color:var(--gold);font:700 11px var(--mono);margin-right:4px}
.ap{display:inline-block;font:800 10px var(--mono);color:#000;background:var(--gold);border-radius:4px;padding:0 4px;margin-right:5px;vertical-align:2px;box-shadow:0 0 6px rgba(255,210,63,.5)}
.gdb{display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 3px;border-radius:999px;background:#fff;color:#000;font:800 10px var(--tech);letter-spacing:.06em;box-shadow:0 0 10px rgba(255,140,0,.6)}
.gdb img{height:22px;width:auto;display:block}
.tname .rec{color:var(--dim);font:500 11px var(--mono);margin-left:5px}
.lines{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px;text-align:center}
.lines>div{background:#000;border:1px solid var(--edge);border-radius:8px;padding:5px 4px}
.lines .k{font:700 9.5px var(--tech);letter-spacing:.1em;color:var(--dim)}.lines .v{font:700 14px var(--mono)}
.confbar{height:6px;background:#1d1433;border-radius:4px;overflow:hidden;margin-top:6px}.confbar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--blue))}
/* edge of the week */
.eotw{position:relative;border:2px solid var(--gold);border-radius:18px;padding:20px;background:radial-gradient(600px 220px at 20% 0%,rgba(255,210,63,.16),transparent 60%),linear-gradient(160deg,#1d1205,#0d0717 55%);
  box-shadow:0 0 26px rgba(255,210,63,.35),inset 0 0 40px rgba(255,46,136,.12);overflow:hidden}
.eotw:before{content:"";position:absolute;left:12px;right:12px;top:7px;height:8px;background:radial-gradient(circle,#fff6c4 0 2.5px,#ffd23f 3px 4px,transparent 4.5px) 0 0/18px 8px repeat-x;filter:drop-shadow(0 0 4px #ffd23f);animation:bulbs 1s steps(2) infinite}
@keyframes bulbs{50%{opacity:.35}}
.eotw .lbl{font:900 13px var(--tech);letter-spacing:.3em;color:var(--gold);text-shadow:var(--y-glow)}
.eotw .pick{font:400 clamp(34px,6vw,58px)/1 var(--disp);letter-spacing:.04em;color:#fff;text-shadow:0 0 14px rgba(255,210,63,.6);margin:8px 0 2px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.kv>div{background:rgba(0,0,0,.55);border:1px solid var(--edge2);border-radius:10px;padding:7px 10px}
.kv .k{font:700 9.5px var(--tech);letter-spacing:.12em;color:var(--dim)}.kv .v{font:800 18px var(--mono)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--blue);background:rgba(30,227,255,.08);color:var(--blue);font:700 12px var(--tech);letter-spacing:.08em;cursor:pointer}
.btn:hover{box-shadow:var(--b-glow)}.btn.gold{border-color:var(--gold);color:#000;background:var(--gold)}.btn.ghost{border-color:var(--edge2);color:var(--ink);background:var(--panel)}
.btn.green{border-color:var(--green);color:var(--green);background:rgba(57,255,136,.08)}
/* movers board */
.board{font-family:var(--mono);font-size:13px}
.board .row{display:grid;grid-template-columns:22px 1fr auto auto;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px dashed var(--edge);cursor:pointer}
.board .row:hover{background:rgba(30,227,255,.05)}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 8px;border-bottom:1px solid var(--edge);text-align:left;vertical-align:top}
th{font:700 10px var(--tech);letter-spacing:.12em;color:var(--gold);background:#000;text-transform:uppercase}
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--edge2)}
/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(3,1,8,.86);backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:20px 10px 90px}
.modal.hidden{display:none}
.sheet{width:min(1100px,100%);background:linear-gradient(170deg,#140c25,#08050f);border:1px solid var(--edge2);border-radius:18px;box-shadow:0 0 40px rgba(176,107,255,.25)}
.sheet .hd{position:sticky;top:0;z-index:2;background:linear-gradient(180deg,#140c25 85%,rgba(20,12,37,.0));border-radius:18px 18px 0 0;padding:14px 16px 6px}
.close{position:absolute;right:12px;top:10px;width:36px;height:36px;border-radius:50%;border:1px solid var(--edge2);background:#000;color:#fff;font-size:18px;cursor:pointer}
.mtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px}.mtabs::-webkit-scrollbar{display:none}
.mtab{flex:none;padding:6px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--edge2);font:700 11px var(--tech);letter-spacing:.1em;cursor:pointer}
.mtab.on{background:var(--blue);color:#000;border-color:var(--blue);box-shadow:var(--b-glow)}
.sheet .bd{padding:4px 16px 20px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.vs .at{font:400 30px var(--disp);color:var(--dim)}
.fair{border:1px solid var(--blue);border-radius:14px;padding:12px;background:rgba(30,227,255,.05);box-shadow:inset 0 0 22px rgba(30,227,255,.12)}
.fair .big{font:900 30px var(--tech);color:var(--blue);text-shadow:var(--b-glow)}
.says{border-left:4px solid var(--gold);padding:8px 12px;background:rgba(255,210,63,.05);border-radius:0 12px 12px 0}
.why li{margin:4px 0}.why .val{font:700 12px var(--mono);padding:1px 7px;border-radius:6px;margin-right:6px}
.hbar{display:grid;grid-template-columns:150px 1fr 70px;gap:8px;align-items:center;margin:5px 0;font-size:12.5px}
.hbar .track{position:relative;height:12px;background:#120b22;border-radius:6px;overflow:hidden}
.hbar .track i{position:absolute;top:0;bottom:0;border-radius:6px}.hbar .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#666}
.regime{display:flex;height:16px;border-radius:8px;overflow:hidden;border:1px solid var(--edge2)}.regime i{display:block;height:100%}
.seq{display:flex;gap:4px;flex-wrap:wrap}.seq span{padding:2px 7px;border-radius:6px;font:700 10px var(--tech);letter-spacing:.05em}
.s-up{background:rgba(255,159,46,.18);color:var(--orange);border:1px solid var(--orange)}.s-dn{background:rgba(30,227,255,.12);color:var(--blue);border:1px solid var(--blue)}
.s-n{background:rgba(176,107,255,.12);color:var(--purple);border:1px solid var(--purple)}
.ring{--v:50;width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--c,var(--blue)) calc(var(--v)*1%),#1d1433 0);display:grid;place-items:center;box-shadow:0 0 16px rgba(30,227,255,.25)}
.ring b{width:66px;height:66px;border-radius:50%;background:#0b0716;display:grid;place-items:center;font:900 20px var(--tech)}
.light{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.light.green{background:var(--green);box-shadow:var(--g-glow)}.light.yellow{background:var(--gold);box-shadow:var(--y-glow)}.light.red{background:var(--red);box-shadow:var(--r-glow)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 12px}
.filters select,.filters input,.tool select{background:#000;color:var(--ink);border:1px solid var(--edge2);border-radius:9px;padding:7px 10px;font:600 13px Inter}
.filters input{min-width:180px}
.seg{display:inline-flex;border:1px solid var(--edge2);border-radius:9px;overflow:hidden}.seg button{background:#000;border:0;padding:7px 10px;font:700 11px var(--tech);color:var(--dim);cursor:pointer}
.seg button.on{background:var(--purple);color:#fff}
.feed .it{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--edge);font-family:var(--mono);font-size:12.5px}.feed .t{color:var(--dim2);flex:none;width:58px}
.flash-up{animation:fu 2.4s ease-out 1}.flash-dn{animation:fd 2.4s ease-out 1}
@keyframes fu{0%{background:rgba(57,255,136,.45)}100%{background:transparent}}@keyframes fd{0%{background:rgba(255,69,102,.45)}100%{background:transparent}}
.arrow-up{color:var(--green);animation:bob 1.6s ease-in-out infinite}.arrow-dn{color:var(--red);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px)}}
.stale{margin:14px 0;padding:14px 16px;border:2px solid var(--red);border-radius:14px;background:rgba(255,69,102,.10);color:#ffd6dd;box-shadow:var(--r-glow)}
.empty{border:1px dashed var(--edge2);border-radius:12px;padding:16px;color:var(--dim)}
svg text{font-family:var(--mono);font-size:10px;fill:var(--dim)}
.countdown{font:800 16px var(--mono);color:var(--green)}
.feat-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.feat{position:relative;overflow:hidden;border-radius:18px;padding:16px 16px 14px;cursor:pointer;min-height:300px}
.feat .ttl{font:900 12px var(--tech);letter-spacing:.24em;display:flex;align-items:center;gap:10px}
.feat .vsrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;margin:12px 0 8px}
.feat .vsrow img{width:62px;height:62px;object-fit:contain}
.feat .nm{font:800 15px Inter;color:#fff}.feat .sm{font:500 11.5px var(--mono);color:var(--dim)}
.feat .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.feat .grid3>div{background:rgba(0,0,0,.45);border-radius:9px;padding:6px 8px;text-align:center}
.feat .grid3 .k{font:700 9px var(--tech);letter-spacing:.1em;color:var(--dim)}.feat .grid3 .v{font:800 14px var(--mono);color:#fff}
.feat-gd{border:2px solid #ff7a00;background:radial-gradient(500px 240px at 0% 0%,rgba(255,122,0,.22),transparent 60%),linear-gradient(160deg,#1b0e04,#0b0612 60%);
  box-shadow:0 0 24px rgba(255,122,0,.45),inset 0 0 30px rgba(255,122,0,.10)}
.feat-gd .ttl{color:#ff9a3c;text-shadow:0 0 10px rgba(255,122,0,.7)}
.feat-am{border:2px solid #8c1d2f;background:radial-gradient(520px 260px at 100% 0%,rgba(80,0,0,.55),transparent 65%),linear-gradient(160deg,#1e0408,#0b0612 65%);
  box-shadow:0 0 26px rgba(140,29,47,.65),inset 0 0 0 1px rgba(255,255,255,.08),inset 0 0 40px rgba(80,0,0,.35)}
.feat-am .ttl{color:#fff;text-shadow:0 0 10px rgba(255,255,255,.35)}
.feat-am .wm{position:absolute;right:-30px;bottom:-34px;width:230px;opacity:.07;pointer-events:none;filter:grayscale(1) brightness(3)}
.feat-am .bar-am{position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(#fff,#500000 30%,#500000 70%,#fff)}
.liveslot:empty{display:none}
.lbox{margin-top:10px;border-radius:12px;padding:10px 12px;background:rgba(0,0,0,.6);border:1px solid var(--green);box-shadow:0 0 14px rgba(57,255,136,.25)}
.lbox.post{border-color:var(--dim);box-shadow:none}
.lbox .score{display:flex;justify-content:space-between;align-items:center;font:900 26px var(--tech)}
.lbox .score span.tm{font:800 14px Inter;color:var(--dim)}
.livetag{display:inline-flex;align-items:center;gap:6px;font:900 11px var(--tech);letter-spacing:.14em;color:var(--green)}
.livetag .dot{background:var(--green);box-shadow:0 0 8px var(--green)}

function lineChart(series, opts = {}) {
  const W = opts.w || 640, H = opts.h || 180, P = 28;
  const pts = series.flatMap(s => s.data.filter(d => d.y != null));
  if (pts.length < 2) return '<div class="empty small">Not enough history yet - this chart fills in as the model updates.</div>';
  let ys = pts.map(d => d.y); (opts.refs || []).forEach(r => r.y != null && ys.push(r.y));
  let lo = Math.min(...ys), hi = Math.max(...ys); if (hi - lo < 2) { lo -= 1; hi += 1; }
  const xs = pts.map(d => d.x), x0 = Math.min(...xs), x1 = Math.max(...xs) === x0 ? x0 + 1 : Math.max(...xs);
  const X = x => P + (x - x0) / (x1 - x0) * (W - 2 * P), Y = y => H - P - (y - lo) / (hi - lo) * (H - 2 * P);
  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">`;
  for (let k = 0; k <= 3; k++) { const y = lo + (hi - lo) * k / 3; s += `<line x1="${P}" x2="${W - P}" y1="${Y(y)}" y2="${Y(y)}" stroke="#2c1c4d" stroke-dasharray="3 4"/><text x="2" y="${Y(y) + 3}">${y.toFixed(1)}</text>`; }
  (opts.refs || []).forEach(r => { if (r.y != null) s += `<line x1="${P}" x2="${W - P}" y1="${Y(r.y)}" y2="${Y(r.y)}" stroke="${r.c}" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W - P - 4}" y="${Y(r.y) - 4}" text-anchor="end" style="fill:${r.c}">${esc(r.label)}</text>`; });
  series.forEach(se => { const d = se.data.filter(p => p.y != null); if (!d.length) return;
    s += `<polyline points="${d.map(p => X(p.x) + "," + Y(p.y)).join(" ")}" fill="none" stroke="${se.c}" stroke-width="2.4" style="filter:drop-shadow(0 0 4px ${se.c})"/>`;
    d.forEach(p => s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3" fill="${se.c}"><title>${esc(p.t || "")}: ${p.y}</title></circle>`);
    if (se.label) s += `<text x="${X(d[d.length - 1].x) - 4}" y="${Y(d[d.length - 1].y) - 6}" text-anchor="end" style="fill:${se.c}">${esc(se.label)}</text>`; });
  if (opts.xlab) opts.xlab.forEach(l => s += `<text x="${X(l.x)}" y="${H - 6}" text-anchor="middle">${esc(l.t)}</text>`);
  return s + "</svg>";
}
function bars(items, opts = {}) { const max = Math.max(...items.map(i => Math.abs(i.v)), 1e-9);
  return items.map(i => `<div class="hbar"><span class="small">${esc(i.k)}</span><div class="track"><i style="left:0;width:${Math.abs(i.v) / max * 100}%;background:${i.c || "var(--purple)"}"></i></div><span class="mono small">${esc(i.lab != null ? i.lab : num(i.v, 2))}</span></div>`).join(""); }
function divBar(label, v, max, favor) { const w = Math.min(Math.abs(v) / max, 1) * 50;

function boardList() {

  const bestFor = g => g.bets.filter(b => b.market === mk).sort((a, b) => (b.ev || -9) - (a.ev || -9))[0];
  const edgeOf = g => F.mkt === "total" ? Math.abs(g.model.edge_total || 0) : Math.abs(g.model.edge_spread || 0);
  let L = D.games.filter(g => {
    if (F.q && !(`${g.home.school} ${g.away.school} ${g.home_name} ${g.away_name}`.toLowerCase().includes(F.q.toLowerCase()))) return false;
    if (F.conf !== "All") { const cs = [g.home.conf, g.away.conf]; if (F.conf === "G5" ? cs.every(c => P4.includes(c)) : !cs.includes(F.conf)) return false; }

/* ---------- SIMULATION ---------- */
function simulate(sim, ctx, N = 10000) {
  if (sim.mu_m == null || sim.sig_m == null) return '<div class="empty">No simulation inputs.</div>';
  const sm = sampler(sim.mu_m, sim.sig_m, "m"), st = sampler(sim.mu_t, sim.sig_t || 16, "t"), hist = {}, scores = {};
  let win = 0, cover = 0, over = 0, push = 0, upset = 0, hs = [], as = [];
  const fav = ctx.spread != null ? (ctx.spread < 0 ? "home" : "away") : null;
  for (let k = 0; k < N; k++) {
    // draw the total conditional on the margin: redraw until both teams have a valid (non-negative) score
    const m = sm(); let t = st(), tries = 0;
    while ((t < Math.abs(m) || (t + m) % 2 !== 0) && tries++ < 200) t = st();
    if (t < Math.abs(m)) t = Math.abs(m); if ((t + m) % 2 !== 0) t += 1; const h = (t + m) / 2, a = (t - m) / 2; hs.push(h); as.push(a);
    hist[m] = (hist[m] || 0) + 1; const key = `${h}-${a}`; scores[key] = (scores[key] || 0) + 1;
    if (m > 0) win++; if (ctx.spread != null) { const v = m + ctx.spread; if (v > 0) cover++; else if (v === 0) push++; }
    if (ctx.total != null && t > ctx.total) over++; if (fav === "home" && m < 0) upset++; if (fav === "away" && m > 0) upset++;
  }
  const med = arr => { const s = arr.slice().sort((x, y) => x - y); return s[s.length >> 1]; }, avg = arr => arr.reduce((x, y) => x + y, 0) / arr.length;
  const lo = -45, hi = 45, W = 720, H = 200, P = 24, maxc = Math.max(...Object.values(hist));
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
  for (let m = lo; m <= hi; m++) { const c = hist[m] || 0, x = P + (m - lo) / (hi - lo) * (W - 2 * P), bh = c / maxc * (H - 2 * P);
    const isKey = [3, 7, 10, 14, 17, 21].includes(Math.abs(m)); svg += `<rect x="${x - 3}" y="${H - P - bh}" width="6" height="${bh}" fill="${m > 0 ? "#1ee3ff" : "#ff2e88"}" opacity="${isKey ? 1 : .6}"><title>${m > 0 ? "Home by " + m : m < 0 ? "Away by " + (-m) : "tie"}: ${(c / N * 100).toFixed(1)}%</title></rect>`; }
  const X = v => P + (v - lo) / (hi - lo) * (W - 2 * P);
  svg += `<line x1="${X(0)}" x2="${X(0)}" y1="${P / 2}" y2="${H - P}" stroke="#777" stroke-dasharray="3 3"/>`;
  if (ctx.spread != null) svg += `<line x1="${X(-ctx.spread)}" x2="${X(-ctx.spread)}" y1="${P / 2}" y2="${H - P}" stroke="#ffd23f" stroke-width="2.5"/><text x="${X(-ctx.spread) + 4}" y="${P}" style="fill:#ffd23f">MARKET ${line(ctx.spread)}</text>`;
  svg += `<line x1="${X(sim.mu_m)}" x2="${X(sim.mu_m)}" y1="${P / 2}" y2="${H - P}" stroke="#39ff88" stroke-width="2" stroke-dasharray="5 3"/><text x="${X(sim.mu_m) + 4}" y="${P + 14}" style="fill:#39ff88">MODEL</text>`;
  svg += `<text x="${P}" y="${H - 6}">${esc(abbr(ctx.away))} by 45</text><text x="${W / 2}" y="${H - 6}" text-anchor="middle">tie</text><text x="${W - P}" y="${H - 6}" text-anchor="end">${esc(abbr(ctx.home))} by 45</text></svg>`;
  const top = Object.entries(scores).sort((a, b) => b[1] - a[1]).slice(0, 6);
  return `<div class="panel" style="margin-top:10px"><h3 style="margin-top:0">${N.toLocaleString()} SIMULATIONS · drawn from the model's predicted margin & total distributions</h3>
   <div class="kv">${[["WIN " + abbr(ctx.home), pct(win / N)], ["WIN " + abbr(ctx.away), pct(1 - win / N)],
     ...(ctx.spread != null ? [[abbr(ctx.home) + " COVERS " + line(ctx.spread), pct(cover / (N - push || 1))]] : []),
     ...(ctx.total != null ? [["OVER " + ctx.total, pct(over / N)], ["UNDER " + ctx.total, pct(1 - over / N)]] : []),
     ["AVG SCORE", `${avg(hs).toFixed(1)}-${avg(as).toFixed(1)}`], ["MEDIAN SCORE", `${med(hs)}-${med(as)}`], ...(fav ? [["UPSET", pct(upset / N)]] : [])]
     .map(([k, v]) => `<div><div class="k">${esc(k)}</div><div class="v w">${esc(v)}</div></div>`).join("")}</div>
   <div style="margin-top:10px">${svg}</div><div class="tiny muted">Margin distribution (home perspective). Brighter bars = key numbers (3, 7, 10, 14, 17, 21), weighted from real college results. Totals are drawn conditional on each simulated margin (a blowout needs points), so simulated O/U can differ slightly from the stand-alone total.</div>
   <div class="small" style="margin-top:6px">Most common final scores: ${top.map(([k, c]) => `<span class="chip">${esc(abbr(ctx.home))} ${k.replace("-", " · " + abbr(ctx.away) + " ")} <span class="d">${(c / N * 100).toFixed(1)}%</span></span>`).join("")}</div></div>`;
}

  if (x.type === "prop") {

    } else {
      const cover = margin + (+e.line), more = cover <= 0 ? Math.floor(-cover) + 1 : 0;
      const pc = lm && !fin ? 1 - Phi((-e.line - tMu) / lm.sig) : null, liveL = gs.odds ? (isH ? gs.odds.spH.live : gs.odds.spA.live) : null;
      main = `${esc(e.team || tName(me))} ${line(+e.line)}`;
      grid = kv("CURRENT MARGIN", `${me.abbr} ${margin > 0 ? "+" : ""}${margin}`) + kv("REQUIRED", e.line < 0 ? `win by ${Math.floor(-e.line) + 1}+` : `lose by ${Math.ceil(e.line) - 1} or less`) +
        kv(cover > 0 ? "COVERING BY" : "NEEDS", cover > 0 ? `${cover} pts` : `${more} more pt${more === 1 ? "" : "s"} of margin`, cover > 0 ? "g" : "y") +
        (pc != null ? kv("MODEL COVER CHANCE NOW", pct(pc, 0), "g") + kv("MODEL PROJ. MARGIN", `${me.abbr} ${tMu > 0 ? "+" : ""}${num(tMu)}`, "b") : "") +
        (liveL && liveL.line != null && !fin ? kv("LIVE MARKET", `${me.abbr} ${line(liveL.line)}`) : "") +
        (lm && !fin ? kv("UPDATED MODEL FINAL", `${gs.away.abbr} ${num(lm.projA, 0)}-${num(lm.projH, 0)} ${gs.home.abbr}`, "b") : "");
    }
  }
  return `<div class="trk-box ${fin ? "post" : ""}"><div class="lv-top"><span class="lv-clock">${gs.state === "in" ? '<span class="livetag"><span class="dot"></span></span> ' : ""}${big ? "★ BEST BET OF THE WEEK · " : ""}${esc(clockTxt(gs))}</span>${stChip(st)}</div>
    ${big ? scoreRows(gs) : `<div class="mono small"><b>${esc(gs.away.abbr)} ${gs.away.score} - ${gs.home.score} ${esc(gs.home.abbr)}</b></div>`}
    <div class="trk-big">${main}</div><div class="trk-grid">${grid}</div>
    ${big ? `<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">${addBtnRaw(e.gid, e.label, 1, true)}<button class="btn ghost" data-showpre style="padding:3px 10px">SHOW / HIDE PREGAME ANALYSIS</button></div>` : ""}
    <div class="tiny muted" style="margin-top:6px">Live projections are probabilities, not guarantees - a bet is only WON or LOST once it's mathematically decided.</div></div>`;
}
const PROP_NAMES_JS = {pass_yds: "passing yards", rush_yds: "rushing yards", rec_yds: "receiving yards", receptions: "receptions"};
async function fillTracks() {
  const els = [...document.querySelectorAll("[data-trk]")]; if (!els.length) return;
  await liveBoard();
  for (const el of els) {
    let m; try { m = JSON.parse(el.dataset.trk); } catch (e) { continue; }
    const b = (LV.board || []).find(x => x.id === String(m.gid)); if (!b || b.state === "pre") continue;
    const gs = await liveSummary(m.gid); if (!gs) continue;
    el.innerHTML = m.type === "game" ? trackGameHTML(gs, m) : el.dataset.compact ? compactTrack(m, gs) : trackHTML(m, gs, !!el.dataset.big);
    const hero = el.closest(".home-hero"); if (hero && el.dataset.big) hero.classList.add("is-live");
    const sp = el.querySelector("[data-showpre]"); if (sp) sp.onclick = ev => { ev.stopPropagation(); hero && hero.classList.toggle("show-pre"); };
  }
}
function officialPropCard(x, big) {
  const g = G[x.gid];
  return `<div class="gc official" ${x.gid ? `data-g="${x.gid}"` : ""}><div class="top"><span>${esc(fmtTime(x.kickoff))}${g && g.tv ? " · " + esc(g.tv) : ""}</span><span class="chip official">★ OFFICIAL PLAY · PLAYER PROP</span></div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:6px">${x.team_logo ? `<img class="logo lg" src="${esc(x.team_logo)}" alt="" loading="lazy">` : ""}<div style="flex:1">
     <div class="tiny tech muted">PLAYER</div><div style="font:800 ${big ? 26 : 19}px Inter;color:#fff">${esc(x.player)}</div><div class="muted small">${esc(x.team)} vs ${esc(x.opp)}</div></div>${confRing(x.conf, big ? 86 : 64)}</div>
    <div style="margin:8px 0 2px;font:400 ${big ? 40 : 28}px/1.05 var(--disp);letter-spacing:.04em;color:var(--gold)">${x.side === "over" ? "OVER" : "UNDER"} ${x.line} ${esc(x.prop.toUpperCase())}</div>
    <div class="lines"><div><div class="k">SPORTSBOOK</div><div class="v w">${x.line} (${odds(x.price)}) · ${esc(x.book)}</div></div><div><div class="k">MODEL PROJECTION</div><div class="v b">${num(x.proj)}</div></div>
     <div><div class="k">MODEL EDGE</div><div class="v g">${sgn((x.side === "over" ? 1 : -1) * (x.proj - x.line))} ${esc(PROP_UNIT[x.stat] || "")} ${x.side === "over" ? "over" : "under"} the line</div></div></div>
    <div class="lines"><div><div class="k">WIN CHANCE</div><div class="v">${pct(x.p)}</div></div><div><div class="k">EV</div><div class="v g">${spct(x.ev)}</div></div><div><div class="k">CONFIDENCE</div><div class="v" style="color:${confColor(x.conf)}">${x.conf}</div></div></div>
    ${qualHTML(x.checks)}${trkSlot(propMeta(x))}
    <div style="margin-top:8px">${addBtnRaw(x.gid, propLabel(x), 0.5)}</div></div>`;
}
function withTrack(cardHtml, meta) { const i = cardHtml.lastIndexOf("</div>"); return cardHtml.slice(0, i) + trkSlot(meta) + cardHtml.slice(i); }

/* ---------- render ---------- */
function render() {
  const r = route(); nav(); const app = $("#app");
  const gamesV = () => LEAGUE() === "NFL" ? `<h2 class="sec" style="color:var(--gold)">NFL GAMES</h2>` + nflBoard() : LEAGUE() === "NCAA" ? games() : `<h2 class="sec" style="color:var(--gold)">NFL GAMES</h2>${nflBoard()}<h2 class="sec">NCAA GAMES</h2>` + games();
  const views = {admin: adminView, home: infoHome, tamu: tamuView, live: liveView, picks, results: resultsView, props: propsView, games: gamesV, rankings, tool, card,
    model: () => r.lg === "NFL" ? nflHealthView() : modelView(r.arg), team: () => team(r.arg), dash: () => r.lg === "NFL" ? nflDash() : home()};
  app.innerHTML = LOCKED && r.v !== "home" ? lockedView() : staleBanner() + (views[r.v] || infoHome)();
  window.scrollTo(0, 0);
  wire(app);
  if (r.v === "games" && $("#board")) wireBoard();
  app.querySelectorAll("[data-cardf]").forEach(b => b.onclick = () => { LS.set("cardf", b.dataset.cardf); render(); });
  app.querySelectorAll("[data-ptab]").forEach(b => b.onclick = () => { LS.set("pickf", {...LS.get("pickf", {tab: "ACTIVE", type: "ALL"}), tab: b.dataset.ptab}); render(); });
  app.querySelectorAll("[data-ptype]").forEach(b => b.onclick = () => { LS.set("pickf", {...LS.get("pickf", {tab: "ACTIVE", type: "ALL"}), type: b.dataset.ptype}); render(); });
  app.querySelectorAll("[data-rf]").forEach(b => b.onclick = () => { const [k, v] = b.dataset.rf.split(":"); LS.set("resf", {...LS.get("resf", {type: "ALL", conf: "ALL", period: "SEASON"}), [k]: v}); render(); });
  if (r.v === "tool") wireTool();
  if (r.v === "card") wireCard();
  if (r.v === "rankings") { const b = $("#rankAll"); if (b) b.onclick = () => { LS.set("rankAll", !LS.get("rankAll", false)); render(); }; }
  app.querySelectorAll("[data-sub]").forEach(b => b.onclick = () => { location.hash = (route().base ? route().base + "/" : "") + "model/" + b.dataset.sub; });
  app.querySelectorAll("[data-add]").forEach(b => b.onclick = e => { e.stopPropagation(); addToCard(b.dataset.add, b.dataset.label, +b.dataset.units || 1); b.textContent = "✓ ON MY CARD"; });
  if (r.v === "live") renderLive(); else { fillSlots(); fillTracks(); }
  if (r.v === "admin") adminLoad();
  if (window.kjLogView && window.KJ && KJ.client) kjLogView(location.hash || "#home");
}
setInterval(() => document.querySelectorAll("[data-ko]").forEach(el => { const s = (new Date(el.dataset.ko) - Date.now()) / 1000;
  el.textContent = s <= 0 ? "LIVE / FINAL" : `${Math.floor(s / 3600)}h ${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}m ${String(Math.floor(s % 60)).padStart(2, "0")}s`; }), 1000);
window.addEventListener("hashchange", () => { closeModal(); render(); window.scrollTo(0, 0); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
ticker(); header(); acctMenu(); render();
})();
</script>
